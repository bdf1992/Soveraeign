# Canonical GitHub label catalogue for Soveraeign.
# Labels are projections of issue metadata. See CONTRIBUTING.md.

- name: "type: epic"
  color: "6F42C1"
  description: "System-spanning coordination and qualification."
- name: "type: village"
  color: "0969DA"
  description: "Bounded operational surface containing bits and stubs."
- name: "type: bit"
  color: "1A7F37"
  description: "Named, independently inspectable system obligation."
- name: "type: stub"
  color: "57606A"
  description: "Repository implementation surface closing one or more bits."

- name: "scope: system"
  color: "5319E7"
  description: "Applies to the complete Soveraeign node."

- name: "village: ground"
  color: "BF8700"
  description: "Ground and Evidence: record, asset, graph, and observation."
- name: "village: trust"
  color: "CF222E"
  description: "Trust and Control: identity, authority, gates, registry, and capability."
- name: "village: motion"
  color: "008B8B"
  description: "Reach and Motion: ingress, delivery, execution, bindings, and composition."
- name: "village: domain"
  color: "8250DF"
  description: "Domain and Qualification: proofing, qualification, and federation."

- name: "horizon: now"
  color: "D1242F"
  description: "Required in the current evidence-gated construction band."
- name: "horizon: next"
  color: "FBCA04"
  description: "Begins after the current gate earns its prerequisites."
- name: "horizon: spanning"
  color: "A371F7"
  description: "Coordinates more than one construction horizon."
- name: "horizon: scale-trust"
  color: "0550AE"
  description: "Deferred until local Phase-I trust is independently qualified."

- name: "effect: record-local"
  color: "D0D7DE"
  description: "Default: changes governed local record state only; normally omitted."
- name: "effect: control"
  color: "A40E26"
  description: "Changes admission, authority, or control state."
- name: "effect: observe-only"
  color: "1F6FEB"
  description: "Observes and reports without committing domain state."
- name: "effect: request-only"
  color: "218BFF"
  description: "May propose or request work but cannot settle it."
- name: "effect: bounded-execution"
  color: "BC4C00"
  description: "Executes within an admitted, leased, and observable boundary."
- name: "effect: external-boundary"
  color: "CF222E"
  description: "Translates across a declared external-system boundary."

- name: "standing: proposed"
  color: "D4C5F9"
  description: "Defined as a proposal; no built evidence exists."
- name: "standing: declared"
  color: "B6BBC0"
  description: "Boundary is declared but implementation has not begun."
- name: "standing: chartered"
  color: "54AEFF"
  description: "Contract or charter exists; implementation is incomplete."
- name: "standing: self-tested"
  color: "2DA44E"
  description: "Built and self-tested; independent witness remains outstanding."

- name: "witness: pending"
  color: "D29922"
  description: "Independent witness receipt is outstanding; normally held in project metadata."
- name: "witness: witnessed"
  color: "2DA44E"
  description: "Independent witness receipt is current and resolvable."
- name: "witness: demoted"
  color: "CF222E"
  description: "Prior witness standing was demoted by a defeating observation."
