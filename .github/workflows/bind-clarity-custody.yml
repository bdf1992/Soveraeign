name: bind clarity backlog custody

on:
  push:
    branches:
      - closure/phase-i-zero-state

permissions:
  contents: write

jobs:
  bind:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: closure/phase-i-zero-state
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bind the queued clarity obligation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('contracts/custodies.json')
          doc = json.loads(path.read_text(encoding='utf-8'))
          custody_id = 'custody:clarity/current-prose'
          if any(row.get('custody_id') == custody_id for row in doc['custodies']):
              raise SystemExit(f'{custody_id} already exists')

          doc['title'] = 'Custody collection — historical Phase I terminals and current durable obligations'
          old_note = doc.get('note', '')
          prefix = (
              'This collection preserves the historical Phase-I custody terminals and may also carry '
              'explicit outside-phase obligations. An outside-phase custody is durable queued responsibility; '
              'it does not reopen Phase I and it does not imply an active work lease. '
          )
          if not old_note.startswith(prefix):
              doc['note'] = prefix + old_note

          doc['custodies'].append({
              'custody_schema': 'soveraeign-custody/v1',
              'status': 'PROPOSED',
              'custody_id': custody_id,
              'custody_kind': 'DELIVERY',
              'initiative': 'Every eligible current human-facing artifact receives an unslop/v1 reconsideration and a current clarity/v1 receipt against its governing basis.',
              'held_by': 'seat:session-control',
              'roots': [
                  {
                      'root_kind': 'GROUND',
                      'reference': 'GROUND-006',
                      'serves': 'what may be asked of the node must remain discoverable from the artifact alone, so current reader surfaces cannot silently drift from their basis'
                  },
                  {
                      'root_kind': 'GROUND',
                      'reference': 'GROUND-010',
                      'serves': 'a review report is not current evidence unless the reviewed content and its basis are still the bytes the receipt names'
                  }
              ],
              'circuit': 'soveraeign-work-circuit/v1',
              'entry_stage': 'ROOT_POINT',
              'target_stage': 'EXPLODED_SURFACE',
              'closure': {
                  'check': {
                      'kind': 'COMMAND',
                      'expression': 'python scripts/sov_clarity.py gate'
                  },
                  'judgement_seat': 'seat:root',
                  'defeated_by': 'coverage reaches 100% by excluding current prose, retaining stale basis digests, or recording review without actually reconsidering the artifact claim'
              },
              'estimate': {
                  'estimate_schema': 'soveraeign-estimate/v1',
                  'estimated_by': 'principal:closure-controller',
                  'estimated_at': '2026-08-30T22:18:00Z',
                  'basis': 'The obligation is known but intentionally unleased. The denominator is measured at 138 eligible artifacts with 120 unchecked. ROOT_POINT permits only the cost of finding out, so this estimate claims no delivery time or batch count.',
                  'maturity': 'DISCOVERY_ENVELOPE',
                  'dimensions': [
                      {
                          'dimension_id': 'grants',
                          'low': 0,
                          'high': 0,
                          'note': 'The queued obligation predicts no new authority grant; later work must still use whatever repository-write authority its lease requires.'
                      },
                      {
                          'dimension_id': 'judgement_units',
                          'low': 0,
                          'high': 1,
                          'note': 'Ordinary review is mechanical; at most one owner judgement is expected if the terminal itself needs settlement.'
                      }
                  ]
              },
              'members': [
                  {
                      'member_kind': 'TICKET',
                      'address': 'issue:#186',
                      'stage': 'ROOT_POINT',
                      'standing': 'OPEN',
                      'work_state': 'READY',
                      'stage_observed_by': None,
                      'note': 'successor concern for the remaining full-corpus Clarity pass; recording it takes no lease'
                  },
                  {
                      'member_kind': 'DOCUMENT',
                      'address': '.clarity/coverage.json',
                      'stage': 'HORIZONTAL_SURFACE',
                      'standing': 'BUILT',
                      'work_state': 'LANDED',
                      'stage_observed_by': None,
                      'note': 'derived coverage record measuring the remaining current-prose population'
                  }
              ],
              'serves_exit': None,
              'outside_phase_exit': 'Full current-prose editorial reconciliation is successor repository hygiene, not a historical Phase-I exit clause.',
              'phase': None,
              'exit_clause': None,
              'depends_on': [],
              'required_authority': None,
              'cleanup_obligations': [],
              'note': 'Known future work remains under durable custody while the Phase-I boundary keeps its active attention on literal closure.'
          })
          path.write_text(json.dumps(doc, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Grade custody and zero-state readers
        run: |
          python scripts/sov_custody.py list
          python scripts/sov_custody.py lifecycle
          python scripts/sov_clarity.py zero
      - name: Rebuild derived documentation
        run: python scripts/sov_docs.py build
      - name: Verify repository
        run: python scripts/verify.py
      - name: Remove one-shot workflow
        run: rm .github/workflows/bind-clarity-custody.yml
      - name: Commit exact wake
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add contracts/custodies.json docs/documentation.html .github/workflows/bind-clarity-custody.yml
          git diff --cached --exit-code && exit 1 || true
          git commit -m "chore(custody): queue full clarity corpus"
          git pull --rebase origin closure/phase-i-zero-state
          git push origin HEAD:closure/phase-i-zero-state
