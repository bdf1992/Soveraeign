name: clarity participant patch

on:
  push:
    branches:
      - closure/phase-i-zero-state

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: closure/phase-i-zero-state
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Make the base output rule explicit
        run: |
          python - <<'PY'
          from pathlib import Path

          agents = Path('AGENTS.md')
          text = agents.read_text(encoding='utf-8')
          marker = '## Design System of Record\n'
          section = '''## Human-facing output\n\nApply `.claude/skills/unslop/SKILL.md` to human-facing prose by default. Plain\nwords, direct verbs, named mechanisms, and canonical project terms are the base\nstyle. Do not preserve inflated wording merely because an earlier draft used it.\n\nFor persisted prose covered by `contracts/clarity.json`, unslop is necessary but\nnot sufficient. A completed `clarity` review also checks the artifact against the\nsources that govern its meaning and records both content and basis digests.\n\n'''
          if '## Human-facing output\n' not in text:
              if marker not in text:
                  raise SystemExit('AGENTS.md insertion marker missing')
              text = text.replace(marker, section + marker, 1)
              agents.write_text(text, encoding='utf-8', newline='\n')

          rules = Path('.cursorrules')
          text = rules.read_text(encoding='utf-8')
          needle = '- Bdo owns product intent, naming, judgement, and phase gates.\n'
          addition = ('- Apply `.claude/skills/unslop/SKILL.md` to human-facing prose by default; '
                      'persisted covered prose also requires a `clarity` review.\n')
          if addition not in text:
              if needle not in text:
                  raise SystemExit('.cursorrules insertion marker missing')
              text = text.replace(needle, needle + addition, 1)
              rules.write_text(text, encoding='utf-8', newline='\n')

          claude = Path('CLAUDE.md')
          text = claude.read_text(encoding='utf-8')
          start = text.index('## Who Claude is here\n')
          traps = text.index('## Known traps\n')
          intro = '''## Who Claude is here\n\nClaude Code is one host binding for Soveraeign. An interactive Claude session is\nnot Sov and does not silently occupy Controller, Orchestrator, Worker, or Witness.\nThose are explicit launched roles.\n\n`AGENTS.md` governs direct repository work. Host capabilities do not create\nauthority: use only the tools, permissions, model, and live grants present in the\ncurrent invocation. A gate is a missing precondition, not permission to invent a\ndifferent path around it.\n\nCarry a concern to a landed result when the host exposes the required capability.\nSettle ordinary reversible choices, repair findings in place, use a helper for a\nsecond reading when useful, and keep independent witness separate from anyone who\nbuilt or edited the change. `python scripts/sov_closure.py loop` prints the closure\nrules and `python scripts/sov_land.py` owns the governed landing path.\n\nHuman-facing output uses `.claude/skills/unslop/SKILL.md` by default. Persisted\ncovered prose also needs a `clarity` review and receipt.\n\n'''
          text = text[:start] + intro + text[traps:]

          system_start = text.index('## What the system is\n')
          snapshot = text.index('## Repository snapshot (informational)\n')
          system = '''## What the system is\n\nRead `GROUND.md` and `CANON.md` for the product, then `SYSTEM.md` for the operating\nmodel. `AGENTS.md`, `CONTRIBUTING.md`, and this file govern participants; they do\nnot own product claims.\n\nOperational state preserves addressed inputs, events, standing changes,\nobservations, receipts, and counter-records. SQLite is the current storage\nmechanism, not semantic authority. Consequential transitions require typed live\ngrants. Phase I is terminal `CLOSED_INCOMPLETE`; no successor phase is active.\n\n'''
          text = text[:system_start] + system + text[snapshot:]
          claude.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Refresh docs and record reviewed participant readers
        run: |
          python scripts/sov_docs.py build
          python scripts/sov_clarity.py record SOV.md --changed
          python scripts/sov_clarity.py record CLAUDE.md --changed
          python scripts/sov_clarity.py check
          python scripts/lint.py

      - name: Commit and remove this workflow
        run: |
          rm .github/workflows/clarity-participant-patch.yml
          git config user.name 'soveraeign-clarity'
          git config user.email 'actions@users.noreply.github.com'
          git add AGENTS.md CLAUDE.md .cursorrules SOV.md docs .clarity/coverage.json .github/workflows/clarity-participant-patch.yml
          git diff --cached --check
          git commit -m 'docs(clarity): make participant prose rules explicit'
          git push origin HEAD:closure/phase-i-zero-state
