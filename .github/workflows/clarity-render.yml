name: clarity render

on:
  push:
    branches:
      - closure/phase-i-zero-state

permissions:
  contents: write

concurrency:
  group: clarity-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: closure/phase-i-zero-state
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Repair clarity integration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          claude = Path('CLAUDE.md')
          text = claude.read_text(encoding='utf-8')
          old = '25 skills, 22 workflows'
          if old not in text:
              raise SystemExit(f'CLAUDE.md snapshot marker not found: {old}')
          claude.write_text(text.replace(old, '27 skills, 22 workflows', 1), encoding='utf-8', newline='\n')

          path = Path('contracts/publication-surface.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          paths = data['paths']
          if not any(row['path'] == '.clarity' for row in paths):
              row = {
                  'path': '.clarity',
                  'surface': 'HUB',
                  'why': 'Machine-checkable clarity review coverage. It records which human-facing artifacts were reviewed and invalidates those receipts when their bytes move.'
              }
              paths.insert(1, row)
          for row in paths:
              if row['path'] == '.claude':
                  row['why'] = row['why'].replace('22 skills, 20 workflows', '27 skills, 22 workflows')
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8', newline='\n')
          PY

      - name: Refresh derived readers
        run: |
          python scripts/sov_diagrams.py stamp
          python scripts/sov_docs.py build

      - name: Check clarity receipts and hygiene
        run: |
          python scripts/sov_clarity.py check
          python scripts/lint.py

      - name: Commit rendered state and remove this workflow
        run: |
          rm .github/workflows/clarity-render.yml
          git config user.name 'soveraeign-clarity'
          git config user.email 'actions@users.noreply.github.com'
          git add CLAUDE.md contracts/publication-surface.json diagrams docs .github/workflows/clarity-render.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'docs(clarity): refresh derived readers'
          git push origin HEAD:closure/phase-i-zero-state
