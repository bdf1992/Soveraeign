name: closure A19 derived-projection repair

on:
  push:
    branches:
      - closure/a19-launch-witness

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: closure/a19-launch-witness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct the machine-checked orientation decision count
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('CLAUDE.md')
          text = path.read_text(encoding='utf-8')
          old = '621 commits, 86 decision records and 29 reports.'
          new = '621 commits, 87 decision records and 29 reports.'
          if text.count(old) != 1:
              raise SystemExit(f'CLAUDE snapshot marker drifted: {text.count(old)} matches')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Re-read STATUS-derived diagrams
        run: |
          # A19 adds an accepted closure-policy row. It changes none of the authority,
          # service, requirement-lifecycle, or crossing facts drawn by these views.
          # Restamping is therefore a re-read of an unchanged drawing, not a rewrite.
          python scripts/sov_diagrams.py stamp
          python scripts/sov_diagrams.py grade
      - name: Rebuild the documentation reader
        run: |
          python scripts/sov_docs.py build
          python scripts/sov_docs.py check
      - name: Recheck A19 semantics and repository hygiene
        run: |
          # Do not run sov_snapshot.py in this full-history helper: while historical
          # refs still exist it counts commits reachable from all refs, unlike the
          # protected PR's shallow merge checkout. Branch-zero/governance cleanup owns
          # that separate stale-orientation problem. The A19-caused decision count is
          # corrected above and protected verify will grade it in its own environment.
          python scripts/sov_closure.py selfcheck
          python scripts/lint.py
      - name: Remove one-shot helper and commit only derived consequences
        shell: bash
        run: |
          rm .github/workflows/closure-a19-projections.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CLAUDE.md diagrams docs/documentation.html .github/workflows/closure-a19-projections.yml
          git commit -m 'docs(closure): refresh A19-derived projections'
          git push origin HEAD:closure/a19-launch-witness
