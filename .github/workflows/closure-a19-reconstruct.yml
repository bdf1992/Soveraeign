name: closure A19 accepted-semantics reconstruction

on:
  push:
    branches:
      - closure/a19-launch-witness

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: closure/a19-launch-witness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch the accepted historical evidence carrier
        run: |
          git fetch --no-tags origin feat/federation-harness-and-hardening
          git cat-file -e b2246f29aa3e9f3f99106dec7dfc05780d621588^{commit}
          git cat-file -e 8da93a2aa65375b9468bbf6c669a11d2045130be^{commit}
      - name: Restore immutable A19 evidence and patch only current operative semantics
        shell: bash
        run: |
          mkdir -p acceptance/accepted reports/observations decisions
          git show b2246f29aa3e9f3f99106dec7dfc05780d621588:acceptance/accepted/A19.json > acceptance/accepted/A19.json
          git show b2246f29aa3e9f3f99106dec7dfc05780d621588:decisions/0100-launch-your-own-witness.md > decisions/0100-launch-your-own-witness.md
          git show b2246f29aa3e9f3f99106dec7dfc05780d621588:reports/observations/2026-08-28-closure-witness-step-witness-observation.json > reports/observations/2026-08-28-closure-witness-step-witness-observation.json
          git show 8da93a2aa65375b9468bbf6c669a11d2045130be:conformance/fixtures/closure/handoff-cases.json > conformance/fixtures/closure/handoff-cases.json

          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{label} marker drifted: {text.count(old)} matches')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Current closure contract: insert only A19's required witness step and tool.
          replace_once(
              'contracts/closure-ownership.json',
              '''    {\n      "step": "verify",\n      "required": true,\n      "note": "python scripts/verify.py against the intended working-tree state",\n      "tool": "run_verify"\n    },\n    {\n      "step": "present_or_land",\n''',
              '''    {\n      "step": "verify",\n      "required": true,\n      "note": "python scripts/verify.py against the intended working-tree state",\n      "tool": "run_verify"\n    },\n    {\n      "step": "witness",\n      "required": true,\n      "note": "launch an independent participant that did not build or read the change and receive its observation",\n      "tool": "launch_witness"\n    },\n    {\n      "step": "present_or_land",\n''',
              'closure loop')
          replace_once(
              'contracts/closure-ownership.json',
              '''  "tools": [\n    "read",\n    "edit",\n    "run_tests",\n    "run_verify",\n    "report",\n    "recruit_helper"\n  ],\n''',
              '''  "tools": [\n    "read",\n    "edit",\n    "run_tests",\n    "run_verify",\n    "launch_witness",\n    "report",\n    "recruit_helper"\n  ],\n''',
              'closure tool vocabulary')

          # Root agent doctrine: carry the accepted A19 rule onto today's text.
          replace_once(
              'AGENTS.md',
              '''A participant that accepts a bounded concern carries it to a landed result. The\ndefault loop is: inspect, implement, test, recruit a helper, repair, verify,\nthen present or land. A leased worker's terminal is a presented, evidenced\nworking tree; for the participant holding the branch it is a landed change.\n''',
              '''A participant that accepts a bounded concern carries it to a landed result. The\ndefault loop is: inspect, implement, test, recruit a helper, repair, verify,\nlaunch an independent witness, then present or land. A leased worker's terminal\nis a presented, evidenced working tree; for the participant holding the branch\nit is a landed change.\n''',
              'AGENTS closure loop')
          replace_once(
              'AGENTS.md',
              '''  A helper that read or edited the change is inside the build and can never\n  witness it; independent observation stays a separate participant.\n''',
              '''  A helper that read or edited the change is inside the build and can never\n  witness it; independent observation stays a separate participant. Launching\n  that separate participant is the builder's own required step whenever the\n  invocation can launch one. "A build cannot witness itself" is the reason to\n  launch the witness, never a reason to stop at an uncommitted tree, and the\n  landing gate is invoked by whoever holds the branch.\n''',
              'AGENTS witness doctrine')
          replace_once(
              'AGENTS.md',
              '''- The required local and CI command is `python scripts/verify.py`. Its wall\n  time after Python starts is graded, not pass/fail: `PLATINUM` at three\n  seconds or less, `GOLD` at six, `SILVER` at fifteen. Past fifteen seconds\n  nothing is earned and the run fails. A slipped grade is a reportable\n  observation, not a failing gate (`decisions/0050`).\n''',
              '''- The required local and CI command is `python scripts/verify.py`. Its wall\n  time after Python starts is graded, not pass/fail: `PLATINUM` at three\n  seconds or less, `GOLD` at six, `SILVER` at fifteen. Past fifteen seconds\n  the run records debt; wall clock alone does not fail the repository\n  (`decisions/0081`, superseding `decisions/0050`).\n- Performance pressure sits on per-check ceilings in\n  `contracts/verification-budget.json`. A pooled check past thirty seconds is\n  a suspect and is rerun serially; only an isolated check still past thirty\n  seconds refuses. Ordinary attributed overruns remain debt.\n- What blocks a landing is semantic failure. `scripts/sov_land.py` runs verify\n  and lint before its gate, so the landing rule follows the verified semantics,\n  not the host's aggregate wall clock.\n''',
              'AGENTS verification policy')

          replace_once(
              'CONTRIBUTING.md',
              '''A contributor who takes a bounded concern carries it to a landed result:\ninspect, implement, test, recruit a helper, repair, verify, then present or\nland. `AGENTS.md`, Closure ownership, is normative; this is the working path\nthrough it, and `contracts/closure-ownership.json` is the table both read.\n''',
              '''A contributor who takes a bounded concern carries it to a landed result:\ninspect, implement, test, recruit a helper, repair, verify, launch an\nindependent witness, then present or land. `AGENTS.md`, Closure ownership, is\nnormative; this is the working path through it, and\n`contracts/closure-ownership.json` is the table both read.\n''',
              'CONTRIBUTING closure loop')
          replace_once(
              'CONTRIBUTING.md',
              '''  Then repair what it finds. A helper that read or edited the change is inside\n  your build and can never witness it.\n''',
              '''  Then repair what it finds. A helper that read or edited the change is inside\n  your build and can never witness it, so launch a separate witness that did\n  not touch the change. That launch is your own step; "I cannot witness my own\n  build" is the reason to make it, never a reason to stop at an uncommitted\n  tree.\n''',
              'CONTRIBUTING witness doctrine')

          replace_once(
              'CLAUDE.md',
              '''settle ordinary reversible engineering choices; recruit a helper subagent when\na second reading would help, without asking; repair findings in place; keep one\nbranch and one pull request per concern; absorb follow-on work that stays\ninside the same service, effect class, and authority; and hand off only at one\nof five named seams. A helper that read or edited a change is inside the build\nand can never witness it. `python scripts/sov_closure.py loop` prints the\ntable; `judge` grades a handoff before it is sent.\n''',
              '''settle ordinary reversible engineering choices; recruit a helper subagent when\na second reading would help, without asking; repair findings in place; keep one\nbranch and one pull request per concern; absorb follow-on work that stays\ninside the same service, effect class, and authority; launch its own independent\nwitness when the host exposes that capability; carry the branch through\n`python scripts/sov_land.py`; and hand off only at one of five named seams. A\nhelper that read or edited a change is inside the build and can never witness\nit. "A build cannot witness itself" is the reason to launch the witness, never\na terminal at an uncommitted tree. `python scripts/sov_closure.py loop` prints\nthe table; `judge` grades a handoff before it is sent\n(`decisions/0100-launch-your-own-witness.md`).\n''',
              'CLAUDE closure doctrine')

          replace_once(
              'STATUS.yaml',
              '''owner_accepted:\n  - id: A5\n''',
              '''owner_accepted:\n  - id: A19\n    packet: acceptance/accepted/A19.json\n    action: ACCEPT\n    by_seat: seat:root\n    at: 2026-08-28T18:04:42Z\n    claim: The closure loop requires a builder with launch capability to launch an independent witness before presenting or landing; inability is a dependency, not a terminal.\n  - id: A5\n''',
              'STATUS A19 acceptance')
          PY
      - name: Prove the accepted closure contract and standing record
        run: |
          python scripts/sov_closure.py selfcheck
          python -m unittest scripts.tests.test_closure
          python scripts/sov_accept.py audit
          python scripts/lint.py
      - name: Remove one-shot helper and commit reconstructed accepted effect
        shell: bash
        run: |
          rm .github/workflows/closure-a19-reconstruct.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md CONTRIBUTING.md CLAUDE.md STATUS.yaml contracts/closure-ownership.json conformance/fixtures/closure/handoff-cases.json acceptance/accepted/A19.json decisions/0100-launch-your-own-witness.md reports/observations/2026-08-28-closure-witness-step-witness-observation.json .github/workflows/closure-a19-reconstruct.yml
          git commit -m 'fix(closure): restore accepted A19 witness step'
          git push origin HEAD:closure/a19-launch-witness
