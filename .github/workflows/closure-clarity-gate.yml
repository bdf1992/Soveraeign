name: closure clarity gate

on:
  push:
    branches:
      - closure/phase-i-zero-state

permissions:
  contents: write

jobs:
  gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: closure/phase-i-zero-state
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require terminal clarity coverage
        run: python scripts/sov_clarity.py gate
      - name: Remove one-shot witness
        run: |
          rm .github/workflows/closure-clarity-gate.yml
          git config user.name 'soveraeign-closure'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/closure-clarity-gate.yml
          git commit -m 'chore(closure): retire clarity gate witness'
          git push origin HEAD:closure/phase-i-zero-state
