name: closure console issuer module-budget repair

on:
  push:
    branches:
      - closure/console-issuer

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: closure/console-issuer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Keep authority module within its owned line budget
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          authority_path = Path('services/console/src/soveraeign_console_service/authority.py')
          text = authority_path.read_text(encoding='utf-8')

          helper = '''\n\ndef _issuer(named: str) -> str:\n    \"\"\"Return the attributable issuer spelling recorded on an authority record.\n\n    A required argument can still be empty. Reject empty or whitespace-only names at\n    the record boundary so CLI and future bindings inherit the same refusal. Identity\n    remains a separate, larger gap: this proves a name exists, not who supplied it.\n    \"\"\"\n    issuer = named.strip()\n    if not issuer:\n        raise AuthorityRefused(\n            \"a grant must name who issued it; an empty issuer is not a name\")\n    return issuer\n'''
          if text.count(helper) != 1:
              raise SystemExit('issuer helper marker drifted')
          text = text.replace(helper, '', 1)

          old = 'from soveraeign_console_service.refusals import AuthorityRefused\n'
          new = ('from soveraeign_console_service.refusals import '
                 'AuthorityRefused, require_issuer_name\n')
          if text.count(old) != 1:
              raise SystemExit('refusal import marker drifted')
          text = text.replace(old, new, 1)

          old = '''    granted_by = _issuer(granted_by)\n    return {\"grant_id\": f\"grant_{uuid.uuid4().hex[:16]}\", \"node_id\": node_id,\n            \"operator_id\": operator_id, \"capability\": capability, \"scope\": scope,\n            \"granted_by\": granted_by, \"granted_at\": granted_at, \"standing\": \"RECORDED\"}\n'''
          new = '''    return {\"grant_id\": f\"grant_{uuid.uuid4().hex[:16]}\", \"node_id\": node_id,\n            \"operator_id\": operator_id, \"capability\": capability, \"scope\": scope,\n            \"granted_by\": require_issuer_name(granted_by), \"granted_at\": granted_at,\n            \"standing\": \"RECORDED\"}\n'''
          if text.count(old) != 1:
              raise SystemExit('grant payload marker drifted')
          text = text.replace(old, new, 1)

          old = '''    revoked_by = _issuer(revoked_by)\n    return {\"grant_id\": grant_id, \"node_id\": node_id, \"revoked_by\": revoked_by,\n            \"revoked_at\": revoked_at, \"standing\": \"RECORDED\"}\n'''
          new = '''    return {\"grant_id\": grant_id, \"node_id\": node_id,\n            \"revoked_by\": require_issuer_name(revoked_by), \"revoked_at\": revoked_at,\n            \"standing\": \"RECORDED\"}\n'''
          if text.count(old) != 1:
              raise SystemExit('revocation payload marker drifted')
          text = text.replace(old, new, 1)
          authority_path.write_text(text, encoding='utf-8')

          refusal_path = Path('services/console/src/soveraeign_console_service/refusals.py')
          text = refusal_path.read_text(encoding='utf-8')
          marker = '''        self.scope = scope\n\n\nclass ModelClaimWithoutProposal(ConsoleRefusal):\n'''
          addition = '''        self.scope = scope\n\n\ndef require_issuer_name(named: str) -> str:\n    \"\"\"Normalize a required authority issuer or refuse an unattributable record.\"\"\"\n    issuer = named.strip()\n    if not issuer:\n        raise AuthorityRefused(\n            \"a grant must name who issued it; an empty issuer is not a name\")\n    return issuer\n\n\nclass ModelClaimWithoutProposal(ConsoleRefusal):\n'''
          if text.count(marker) != 1:
              raise SystemExit('refusal insertion marker drifted')
          text = text.replace(marker, addition, 1)
          refusal_path.write_text(text, encoding='utf-8')
          PY
      - name: Focused Console regression
        run: python -m unittest discover -s services/console/tests -p 'test_cli_walk.py'
      - name: Repository hygiene
        run: python scripts/lint.py
      - name: Remove one-shot helper and commit repair
        shell: bash
        run: |
          rm .github/workflows/closure-console-issuer-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/console/src/soveraeign_console_service/authority.py services/console/src/soveraeign_console_service/refusals.py services/console/tests/test_cli_walk.py .github/workflows/closure-console-issuer-repair.yml
          git commit -m 'refactor(console): keep issuer validation within module budget'
          git push origin HEAD:closure/console-issuer
