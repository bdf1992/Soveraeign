name: closure console issuer reconstruction

on:
  push:
    branches:
      - closure/console-issuer

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: closure/console-issuer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch exact current boundary and existing CLI suite
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          authority_path = Path('services/console/src/soveraeign_console_service/authority.py')
          text = authority_path.read_text(encoding='utf-8')

          marker = '''}\n\n\ndef grant_payload(operator_id: str, capability: str, scope: str, granted_by: str,\n'''
          replacement = '''}\n\n\ndef _issuer(named: str) -> str:\n    \"\"\"Return the attributable issuer spelling recorded on an authority record.\n\n    A required argument can still be empty. Reject empty or whitespace-only names at\n    the record boundary so CLI and future bindings inherit the same refusal. Identity\n    remains a separate, larger gap: this proves a name exists, not who supplied it.\n    \"\"\"\n    issuer = named.strip()\n    if not issuer:\n        raise AuthorityRefused(\n            \"a grant must name who issued it; an empty issuer is not a name\")\n    return issuer\n\n\ndef grant_payload(operator_id: str, capability: str, scope: str, granted_by: str,\n'''
          if text.count(marker) != 1:
              raise SystemExit('authority insertion marker drifted')
          text = text.replace(marker, replacement, 1)

          marker = '''    return {\"grant_id\": f\"grant_{uuid.uuid4().hex[:16]}\", \"node_id\": node_id,\n            \"operator_id\": operator_id, \"capability\": capability, \"scope\": scope,\n            \"granted_by\": granted_by, \"granted_at\": granted_at, \"standing\": \"RECORDED\"}\n'''
          replacement = '''    granted_by = _issuer(granted_by)\n    return {\"grant_id\": f\"grant_{uuid.uuid4().hex[:16]}\", \"node_id\": node_id,\n            \"operator_id\": operator_id, \"capability\": capability, \"scope\": scope,\n            \"granted_by\": granted_by, \"granted_at\": granted_at, \"standing\": \"RECORDED\"}\n'''
          if text.count(marker) != 1:
              raise SystemExit('grant payload marker drifted')
          text = text.replace(marker, replacement, 1)

          marker = '''    return {\"grant_id\": grant_id, \"node_id\": node_id, \"revoked_by\": revoked_by,\n            \"revoked_at\": revoked_at, \"standing\": \"RECORDED\"}\n'''
          replacement = '''    revoked_by = _issuer(revoked_by)\n    return {\"grant_id\": grant_id, \"node_id\": node_id, \"revoked_by\": revoked_by,\n            \"revoked_at\": revoked_at, \"standing\": \"RECORDED\"}\n'''
          if text.count(marker) != 1:
              raise SystemExit('revocation payload marker drifted')
          text = text.replace(marker, replacement, 1)
          authority_path.write_text(text, encoding='utf-8')

          test_path = Path('services/console/tests/test_cli_walk.py')
          text = test_path.read_text(encoding='utf-8')
          marker = 'from soveraeign_console_service import cli  # noqa: E402\n'
          replacement = 'from soveraeign_console_service import authority, cli  # noqa: E402\n'
          if text.count(marker) != 1:
              raise SystemExit('CLI import marker drifted')
          text = text.replace(marker, replacement, 1)

          marker = '''    def test_a_refusal_comes_back_as_json_with_its_reason_code(self) -> None:\n'''
          addition = '''    def test_blank_issuers_are_refused_at_the_record_boundary(self) -> None:\n        \"\"\"Required flags still admitted empty strings until the record checked them.\"\"\"\n        for builder, args in ((authority.grant_payload,\n                               (\"reader\", \"read:thread\", \"thread-1\", \"   \",\n                                \"2026-08-30T00:00:00Z\", NODE)),\n                              (authority.revocation_payload,\n                               (\"grant_example\", \"\\t\",\n                                \"2026-08-30T00:00:00Z\", NODE))):\n            with self.subTest(builder=builder.__name__):\n                with self.assertRaises(authority.AuthorityRefused):\n                    builder(*args)\n\n        grant = authority.grant_payload(\n            \"reader\", \"read:thread\", \"thread-1\", \"  Bdo  \",\n            \"2026-08-30T00:00:00Z\", NODE)\n        revocation = authority.revocation_payload(\n            grant[\"grant_id\"], \"  Bdo  \", \"2026-08-30T00:00:01Z\", NODE)\n        self.assertEqual(grant[\"granted_by\"], BDO)\n        self.assertEqual(revocation[\"revoked_by\"], BDO)\n\n        # Drive the defeating grant case through the operator-facing binding too.\n        with TemporaryDirectory(ignore_cleanup_errors=True) as tmp:\n            store = Path(tmp) / \"console\"\n            out = StringIO()\n            with contextlib.redirect_stdout(out):\n                code = cli.main([\"--root\", str(store), \"--node\", NODE, \"grant\",\n                                 \"--operator\", \"Mallory\", \"--capability\",\n                                 \"read:thread\", \"--scope\", \"thread-1\",\n                                 \"--granted-by\", \"   \"])\n            self.assertEqual(code, 2)\n            answer = json.loads(out.getvalue())\n            self.assertEqual(answer[\"outcome\"], \"REFUSED\")\n            self.assertEqual(answer[\"reason_code\"], \"NO_LIVE_GRANT\")\n\n    def test_a_refusal_comes_back_as_json_with_its_reason_code(self) -> None:\n'''
          if text.count(marker) != 1:
              raise SystemExit('CLI insertion marker drifted')
          text = text.replace(marker, addition, 1)
          test_path.write_text(text, encoding='utf-8')
          PY
      - name: Focused console regression
        run: python -m unittest discover -s services/console/tests -p 'test_cli_walk.py'
      - name: Remove one-shot helper and commit only reconstructed concern
        shell: bash
        run: |
          rm .github/workflows/closure-console-issuer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/console/src/soveraeign_console_service/authority.py services/console/tests/test_cli_walk.py .github/workflows/closure-console-issuer.yml
          git commit -m 'fix(console): refuse blank authority issuers'
          git push origin HEAD:closure/console-issuer
