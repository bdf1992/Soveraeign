name: closure rebuild docs

on:
  push:
    branches:
      - closure/reconstruct-tooling-integrity

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: closure/reconstruct-tooling-integrity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild the checked projection
        run: python scripts/sov_docs.py build
      - name: Commit only the generated page when changed
        shell: bash
        run: |
          if git diff --quiet -- docs/documentation.html; then
            echo 'documentation projection already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/documentation.html
          test "$(git diff --cached --name-only)" = 'docs/documentation.html'
          git commit -m 'chore(docs): rebuild documentation projection'
          git push origin HEAD:closure/reconstruct-tooling-integrity
