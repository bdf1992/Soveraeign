name: Closure regenerate generated docs

on:
  push:
    branches:
      - closure/external-effect-preconditions

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: closure/external-effect-preconditions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild generated documentation
        run: |
          python scripts/sov_docs.py build
          python scripts/sov_surface.py render
      - name: Commit projections and retire this helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/documentation.html docs/surface.html
          git rm .github/workflows/closure-regenerate-generated-docs.yml
          git commit -m 'docs: rebuild generated surfaces'
          git push origin HEAD:closure/external-effect-preconditions
