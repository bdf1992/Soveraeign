name: closure S28 finalize

on:
  push:
    branches:
      - closure/phase-i-zero-state

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: closure/phase-i-zero-state
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Close S28 under its existing historical reading
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('OPEN-SEAMS.md')
          text = path.read_text(encoding='utf-8')

          old = '''read as a claim
about the repository's wiring it is now false, because seven entry points name
`GROUND.md` and `CANON.md` as of this branch.'''
          new = '''read as a claim
about the repository's wiring it is now false, because eight entry points name
`GROUND.md` and `CANON.md` as of this branch.'''
          if old not in text:
              raise SystemExit('S28 entry-point wording not found')
          text = text.replace(old, new, 1)

          old = '''Reading one needs nobody: if the
sentence is scoped to the acceptance act, it is already correct and this seam
closes with a note. Saying so is the point of filing it rather than repairing it.
`acceptance/A22.json` presents the change that raised it.'''
          new = '''Reading one needs nobody: if the
sentence is scoped to the acceptance act, it is already correct and this seam
closes with a note. Saying so is the point of filing it rather than repairing it.

Closed 2026-08-30 under reading one. The sentence remains a historical claim
about the 2026-08-24 acceptance act. PR #183 later wired all eight entry surfaces
without revising the accepted `GROUND-1` artifact. The entry-plane packet is now
recorded as superseded in `acceptance/accepted/A23.json`.'''
          if old not in text:
              raise SystemExit('S28 closing wording not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Rebuild and verify derived reader
        run: |
          python scripts/sov_docs.py build
          python scripts/sov_clarity.py check
          python scripts/lint.py
          python scripts/verify.py

      - name: Commit exact generated closure state and remove helper
        run: |
          rm .github/workflows/closure-s28-finalize.yml
          git config user.name 'soveraeign-closure'
          git config user.email 'actions@users.noreply.github.com'
          git add OPEN-SEAMS.md docs .github/workflows/closure-s28-finalize.yml
          git diff --cached --check
          git commit -m 'docs(closure): close S28 historical reading'
          git push origin HEAD:closure/phase-i-zero-state
