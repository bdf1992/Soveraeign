name: closure S28 finalize

on:
  push:
    branches:
      - closure/phase-i-zero-state

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: closure/phase-i-zero-state
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Close S28 under its existing historical reading
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('OPEN-SEAMS.md')
          text = path.read_text(encoding='utf-8')
          old_count = "because seven entry points name"
          new_count = "because eight entry points name"
          if text.count(old_count) != 1:
              raise SystemExit(f'expected one S28 count phrase, found {text.count(old_count)}')
          text = text.replace(old_count, new_count, 1)
          old_packet = "`acceptance/A22.json` presents the change that raised it."
          new_packet = ("Closed 2026-08-30 under reading one. The sentence remains a historical claim "
                        "about the 2026-08-24 acceptance act. PR #183 later wired all eight entry "
                        "surfaces without revising the accepted `GROUND-1` artifact. The entry-plane "
                        "packet is now recorded as superseded in `acceptance/accepted/A23.json`.")
          if text.count(old_packet) != 1:
              raise SystemExit(f'expected one S28 packet phrase, found {text.count(old_packet)}')
          text = text.replace(old_packet, new_packet, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Record clarity and rebuild derived reader
        run: |
          python scripts/sov_clarity.py record OPEN-SEAMS.md --changed
          python scripts/sov_clarity.py check
          python scripts/sov_docs.py build

      - name: Commit exact generated closure state and remove helper
        run: |
          rm .github/workflows/closure-s28-finalize.yml
          git config user.name 'soveraeign-closure'
          git config user.email 'actions@users.noreply.github.com'
          git add OPEN-SEAMS.md .clarity/coverage.json docs .github/workflows/closure-s28-finalize.yml
          git diff --cached --check
          git commit -m 'docs(closure): close S28 historical reading'
          git push origin HEAD:closure/phase-i-zero-state
