name: closure tree export

on:
  push:
    branches:
      - closure/phase-i-zero-state

permissions:
  contents: read

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: closure/phase-i-zero-state
      - name: Record exported head
        run: git rev-parse HEAD > closure-export-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: closure-tree-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .
            !.git/**
            !.local/**
            !.soveraeign/**
