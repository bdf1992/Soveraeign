name: closure terminal repair

on:
  push:
    branches:
      - closure/phase-i-zero-state

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: closure/phase-i-zero-state
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore terminal SPEC and retire helper
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- SPEC.md
          rm -f .github/workflows/closure-tree-export.yml

      - name: Refresh clarity receipts affected by SPEC
        env:
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          coverage = json.loads(Path('.clarity/coverage.json').read_text(encoding='utf-8'))
          paths = {'SPEC.md'}
          for path, review in coverage.get('reviews', {}).items():
              if any(item.get('path') == 'SPEC.md' for item in review.get('basis', [])):
                  paths.add(path)
          env = dict(os.environ)
          env['PYTHONPATH'] = 'scripts'
          for path in sorted(paths):
              subprocess.run(
                  [sys.executable, 'scripts/sov_clarity.py', 'record', path],
                  check=True,
                  env=env,
              )
          print('refreshed:', ', '.join(sorted(paths)))
          PY

      - name: Rebuild derived projections
        run: |
          python scripts/sov_interface.py build
          python scripts/sov_diagrams.py stamp
          python scripts/sov_surface.py render
          python scripts/sov_docs.py build

      - name: Verify exact repaired tree
        env:
          PYTHONPATH: scripts
        run: |
          python scripts/sov_clarity.py zero
          python scripts/sov_clarity.py check
          python scripts/sov_diagrams.py grade
          python scripts/sov_surface.py check
          python scripts/sov_docs.py check
          python scripts/verify.py
          python scripts/lint.py

      - name: Commit exact repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(closure): restore terminal spec and rebuild projections"
          git push origin HEAD:closure/phase-i-zero-state
