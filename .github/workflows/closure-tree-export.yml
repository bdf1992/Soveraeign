name: closure zero finalizer

on:
  push:
    branches:
      - closure/phase-i-zero-state

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: closure/phase-i-zero-state
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Recover and apply locally verified zero-state patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, lzma, re
          carrier = Path('.github/workflows/zero-reader-finalize.yml').read_text(encoding='utf-8')
          match = re.search(r"<<'PATCH'\n(.+?)\nPATCH", carrier, re.S)
          if not match:
              raise SystemExit('patch carrier missing')
          raw = base64.b64decode(''.join(match.group(1).split()))
          Path('/tmp/zero.patch').write_bytes(lzma.decompress(raw))
          PY
          git apply /tmp/zero.patch
          rm -rf .clarity/review-batches
          rm -f .github/workflows/clarity-root-repair.yml
          rm -f .github/workflows/zero-reader-finalize.yml
          rm -f .github/workflows/closure-tree-export.yml

      - name: Rebuild derived documentation
        run: python scripts/sov_docs.py build

      - name: Verify simplified zero state
        run: |
          python scripts/sov_clarity.py zero
          python scripts/sov_clarity.py check
          python scripts/sov_diagrams.py grade
          python scripts/sov_docs.py check
          PYTHONPATH=scripts python -m unittest discover -s scripts/tests -p 'test_sov_clarity.py' -v
          python scripts/lint.py

      - name: Commit exact result and retire helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(closure): simplify clean zero reader gate"
          git push origin HEAD:closure/phase-i-zero-state
