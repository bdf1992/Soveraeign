name: closure zero finalizer

on:
  push:
    branches:
      - closure/phase-i-zero-state

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: closure/phase-i-zero-state
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply simplified zero-state reader contract
        run: |
          cat > /tmp/zero.patch.xz.b64 <<'PATCH'

PATCH
          base64 -d /tmp/zero.patch.xz.b64 | xz -d > /tmp/zero.patch
          git apply /tmp/zero.patch
          rm -rf .clarity/review-batches
          rm -f .github/workflows/closure-tree-export.yml
          rm -f .github/workflows/clarity-root-repair.yml
          rm -f .github/workflows/zero-reader-finalize.yml

      - name: Rebuild derived documentation
        run: |
          python scripts/sov_docs.py build

      - name: Verify zero-state semantics
        run: |
          python scripts/sov_clarity.py zero
          python scripts/sov_clarity.py check
          python scripts/sov_diagrams.py grade
          python scripts/sov_docs.py check
          python -m unittest discover -s scripts/tests -p 'test_sov_clarity.py' -v
          python scripts/lint.py

      - name: Commit exact generated result and retire helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(closure): simplify clean zero reader gate"
          git push origin HEAD:closure/phase-i-zero-state
