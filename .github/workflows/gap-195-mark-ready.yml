name: gap 195 mark PR ready

on:
  push:
    branches:
      - gap/195-participant-isolation

permissions:
  pull-requests: write

jobs:
  ready:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR 196 ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 196 --repo bdf1992/Soveraeign
