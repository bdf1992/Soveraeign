name: gap 195 merged baseline

on:
  push:
    branches:
      - gap/195-participant-isolation

permissions:
  contents: write

jobs:
  verify-merged-gap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh informational snapshot and clarity receipts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          path = Path('CLAUDE.md')
          text = path.read_text(encoding='utf-8')
          count = int(subprocess.check_output(['git','rev-list','--count','HEAD'], text=True).strip()) + 1
          text, n = re.subn(r'it now holds\n\d+ commits,', f'it now holds\n{count} commits,', text, count=1)
          if n != 1:
              raise SystemExit('CLAUDE commit snapshot marker not found exactly once')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          python scripts/sov_clarity.py record README.md --changed
          python scripts/sov_clarity.py record AGENTS.md --changed
          python scripts/sov_clarity.py record SOV.md --changed
          python scripts/sov_clarity.py record CONTRIBUTING.md --changed
          python scripts/sov_clarity.py record CLAUDE.md --changed
          python scripts/sov_clarity.py record .claude/skills/sdlc-feedback/SKILL.md --changed
          python scripts/sov_clarity.py record .claude/skills/sov-compression/SKILL.md --changed
          python scripts/sov_clarity.py record .claude/skills/sov-governance/SKILL.md --changed
          python scripts/sov_clarity.py record .claude/skills/sov-verification/SKILL.md --changed
          python scripts/sov_clarity.py check
      - name: Rebuild merged projections
        run: |
          python scripts/sov_capability.py build
          python scripts/sov_interface.py build
          python scripts/sov_surface.py render
          python scripts/sov_docs.py build
      - name: Focused gap and compression checks
        run: |
          python -m unittest services.gateway.tests.test_gateway_slice
          python -m unittest scripts.tests.test_node_interface
          python -m unittest scripts.tests.test_console_horizontal
          python -m unittest services.host.tests.test_host_service
          python -m unittest scripts.tests.test_gateway_observe
          python -m unittest scripts.tests.test_sov_surface
          python -m unittest scripts.tests.test_trace
          python -m unittest scripts.tests.test_sov_compression
      - name: Full repository verification
        run: |
          python scripts/sov_capability.py check
          python scripts/sov_interface.py check
          python scripts/sov_surface.py check
          python scripts/sov_docs.py check
          python scripts/lint.py
          python scripts/verify.py
      - name: Commit merged derived state
        run: |
          if git diff --quiet; then
            echo 'No derived changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CLAUDE.md .clarity/coverage.json \
            contracts/fixtures/capability-map.reference.json \
            contracts/fixtures/node-interface.reference.json \
            docs/surface.html docs/documentation.html docs/automation.html
          git commit -m 'build(gap): refresh merged participation projections'
          git push
