name: gap 195 final opening readiness

on:
  push:
    branches:
      - gap/195-participant-isolation

permissions:
  contents: write

jobs:
  opening-readiness:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply role, discovery, and rehearsal readiness
        run: python .github/scripts/gap_195_opening_readiness.py apply

      - name: Retire carrier and refresh derived state
        run: python .github/scripts/gap_195_opening_readiness.py finalize

      - name: Refuse unexpected tree changes
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r path; do
            case "$path" in
              .clarity/coverage.json|CLAUDE.md|.claude/README.md|.claude/agents/sov-worker.md|.claude/agents/sov-orchestrator.md|.claude/agents/sov-witness.md|.claude/agents/sov-controller.md|.claude/workflows/sov-loop.js|scripts/sov_next.py|scripts/sov_opening_readiness.py|scripts/tests/test_sov_loop.py|scripts/tests/test_sov_next.py|scripts/tests/test_session_phase_context.py|docs/documentation.html|.github/workflows/gap-195-opening-readiness.yml|.github/scripts/gap_195_opening_readiness.py)
                ;;
              *)
                echo "UNEXPECTED opening-readiness path: $path"
                bad=1
                ;;
            esac
          done < <(git status --porcelain=v1 | sed -E 's/^.. //')
          test "$bad" -eq 0

      - name: Commit final shaped readiness slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(gap): prepare evidenced commissioning handoff'

      - name: Prove role and phase-first behavior
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest scripts.tests.test_sov_loop
          python -m unittest scripts.tests.test_sov_next
          python -m unittest scripts.tests.test_session_phase_context
          node --check .claude/workflows/sov-loop.js
          python scripts/sov_next.py --strict
          python scripts/sov_opening_readiness.py --require-ready
          python scripts/sov_docs.py check
          python scripts/sov_clarity.py check
          python scripts/lint.py

      - name: Full repository verification on committed state
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify.py
          grep -q '^phase: NONE_ACTIVE$' STATUS.yaml
          ! grep -q '"phase_id": "phase:1-5"' contracts/phases.json
          test -z "$(git status --porcelain)"

      - name: Push only verified opening readiness
        run: git push origin HEAD:gap/195-participant-isolation
