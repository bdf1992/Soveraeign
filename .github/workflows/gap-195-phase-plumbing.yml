name: gap 195 phase-aware custody and progress

on:
  push:
    branches:
      - gap/195-participant-isolation

permissions:
  contents: write

jobs:
  phase-plumbing:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply phase-aware custody and progress plumbing
        run: python .github/scripts/gap_195_phase_plumbing.py apply

      - name: Split new concerns out of full modules
        shell: bash
        run: |
          python .github/scripts/gap_195_phase_plumbing_repair.py
          rm .github/scripts/gap_195_phase_plumbing_repair.py

      - name: Retire carrier and refresh derived state
        run: python .github/scripts/gap_195_phase_plumbing.py finalize

      - name: Refuse unexpected tree changes
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r path; do
            case "$path" in
              .clarity/coverage.json|CLAUDE.md|contracts/phase-progress.json|scripts/sovcustody/model.py|scripts/sovcustody/collections.py|scripts/sovcustody/commands.py|scripts/sov_custody.py|scripts/sov_active_phase_progress.py|scripts/sov_phase_progress.py|scripts/sovverify/checks.py|scripts/tests/test_phase_aware_custody.py|scripts/tests/test_active_phase_progress.py|docs/documentation.html|.github/workflows/gap-195-phase-plumbing.yml|.github/scripts/gap_195_phase_plumbing.py|.github/scripts/gap_195_phase_plumbing_repair.py)
                ;;
              *)
                echo "UNEXPECTED phase-plumbing path: $path"
                bad=1
                ;;
            esac
          done < <(git status --porcelain=v1 | sed -E 's/^.. //')
          test "$bad" -eq 0

      - name: Commit final shaped phase plumbing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(gap): make custody and progress phase-aware'

      - name: Prove focused custody and progress behavior
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest scripts.tests.test_phase_aware_custody
          python -m unittest scripts.tests.test_active_phase_progress
          python -m unittest scripts.tests.test_phase_progress
          python scripts/sov_custody.py phase
          python scripts/sov_custody.py reconcile --phase phase:i
          python scripts/sov_phase_progress.py check
          python scripts/sov_docs.py check
          python scripts/sov_clarity.py check
          python scripts/lint.py

      - name: Full repository verification on committed state
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify.py
          test -z "$(git status --porcelain)"

      - name: Push only verified phase plumbing
        run: git push origin HEAD:gap/195-participant-isolation
