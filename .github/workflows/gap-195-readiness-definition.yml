name: gap 195 readiness definition

on:
  push:
    branches:
      - gap/195-participant-isolation

permissions:
  contents: write

jobs:
  readiness-definition:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Normalize temporary readiness helper
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/gap_195_readiness_repair.py
          rm .github/scripts/gap_195_readiness_repair.py

      - name: Apply prepared commissioning definition
        run: python .github/scripts/gap_195_readiness_definition.py apply

      - name: Re-read projections and clarity basis
        run: python .github/scripts/gap_195_readiness_definition.py refresh

      - name: Retire one-shot carrier and finalize derived state
        run: python .github/scripts/gap_195_readiness_definition.py finalize

      - name: Refuse unexpected tree changes
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r path; do
            case "$path" in
              .clarity/coverage.json|PRD.md|SPEC.md|CLAUDE.md|archives/SPEC-PHASE-I-TERMINAL.txt|contracts/phases.json|contracts/README.md|contracts/custody.schema.json|contracts/record-projection.schema.json|contracts/finding.schema.json|conformance/fixtures/commissioning/|conformance/fixtures/commissioning/evidence-contract-cases.json|scripts/tests/test_commissioning_evidence_contracts.py|diagrams/*.md|docs/documentation.html|.github/workflows/gap-195-readiness-definition.yml|.github/scripts/gap_195_readiness_definition.py|.github/scripts/gap_195_readiness_repair.py)
                ;;
              *)
                echo "UNEXPECTED readiness path: $path"
                bad=1
                ;;
            esac
          done < <(git status --porcelain=v1 | sed -E 's/^.. //')
          test "$bad" -eq 0

      - name: Commit final shaped readiness definition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(gap): prepare Phase 1.5 commissioning definition'

      - name: Prove prepared evidence and historical boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest scripts.tests.test_commissioning_evidence_contracts
          python scripts/sov_custody.py phase
          python scripts/sov_custody.py reconcile
          python scripts/sov_f2_gate.py --json >/tmp/phase-i-f2.json || true

      - name: Full repository verification on committed state
        shell: bash
        run: |
          set -euo pipefail
          python scripts/sov_diagrams.py
          python scripts/sov_docs.py check
          python scripts/sov_clarity.py check
          python scripts/lint.py
          python scripts/verify.py
          test -z "$(git status --porcelain)"

      - name: Push only verified readiness definition
        run: git push origin HEAD:gap/195-participant-isolation
