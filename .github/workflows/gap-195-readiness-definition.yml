          cat > scripts/tests/test_commissioning_evidence_contracts.py <<'PY'
          """Positive and defeating cases for the prepared commissioning evidence contracts."""

          from __future__ import annotations

          from copy import deepcopy
          from pathlib import Path
          import json
          import sys
          import unittest

          ROOT = Path(__file__).resolve().parents[2]
          sys.path.insert(0, str(ROOT / "scripts"))

          from sovkernel.jsonschema import validate  # noqa: E402


          class CommissioningEvidenceContractTests(unittest.TestCase):
              @classmethod
              def setUpClass(cls) -> None:
                  corpus = ROOT / "conformance/fixtures/commissioning/evidence-contract-cases.json"
                  cls.cases = json.loads(corpus.read_text(encoding="utf-8"))["cases"]
                  cls.schemas = {
                      name: json.loads((ROOT / "contracts" / name).read_text(encoding="utf-8"))
                      for name in {case["schema"] for case in cls.cases}
                  }
                  cls.positive = {
                      case["schema"]: case["record"]
                      for case in cls.cases if case.get("record") is not None
                  }

              def case_record(self, case: dict) -> dict:
                  record = deepcopy(case.get("record") or self.positive[case["schema"]])
                  if case.get("mutate_subject_kind"):
                      record["subject"]["kind"] = case["mutate_subject_kind"]
                  if case.get("remove"):
                      record.pop(case["remove"], None)
                  for key, value in (case.get("set") or {}).items():
                      record[key] = value
                  return record

              def test_declared_cases(self) -> None:
                  for case in self.cases:
                      with self.subTest(case=case["case_id"]):
                          defects = validate(self.case_record(case), self.schemas[case["schema"]])
                          self.assertEqual(not defects, case["valid"], defects)

              def test_both_subjects_share_one_finding_contract(self) -> None:
                  kinds = {
                      self.case_record(case)["subject"]["kind"]
                      for case in self.cases
                      if case["case_id"] in {"finding-work-positive", "finding-participant-positive"}
                  }
                  self.assertEqual(kinds, {"WORK", "PARTICIPANT_IN_WORK"})


          if __name__ == "__main__":
              unittest.main()
          PY

      - name: Re-read affected diagrams and rebuild derived documentation
        shell: bash
        run: |
          set -euo pipefail
          # The three views were read above: their scoped claims remain true; their
          # omission declarations were corrected for the new objects/profile before restamping.
          python scripts/sov_diagrams.py stamp
          python scripts/sov_docs.py build

      - name: Refresh clarity receipts for changed human-facing sources and views
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            PRD.md \
            SPEC.md \
            contracts/README.md \
            diagrams/source-reader-recording.md \
            diagrams/crossing-typology.md \
            diagrams/requirement-lifecycle.md; do
            python scripts/sov_clarity.py record "$path" --changed
          done

          # PRD/SPEC are bases for other reviewed surfaces. Refresh only already-reviewed
          # dependents that the clarity checker identifies as stale.
          python - <<'PY'
          from __future__ import annotations
          from pathlib import Path
          import json
          import subprocess

          coverage = json.loads(Path('.clarity/coverage.json').read_text(encoding='utf-8'))
          candidates = list(coverage.get('artifacts', coverage).keys())
          for _ in range(3):
              result = subprocess.run(
                  ['python', 'scripts/sov_clarity.py', 'check'], text=True,
                  capture_output=True, check=False)
              stale = []
              for line in (result.stdout + '\n' + result.stderr).splitlines():
                  if 'BASIS_STALE' not in line and 'TEXT_STALE' not in line:
                      continue
                  for path in candidates:
                      if path in line and path not in stale:
                          stale.append(path)
              if not stale:
                  break
              for path in stale:
                  subprocess.run(['python', 'scripts/sov_clarity.py', 'record', path, '--changed'],
                                 check=True)
          PY
          python scripts/sov_clarity.py check

      - name: Remove the one-shot workflow and refresh final host snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/gap-195-readiness-definition.yml
          python - <<'PY'
          from __future__ import annotations
          from pathlib import Path
          import re
          import sys

          sys.path.insert(0, str(Path('scripts').resolve()))
          from sovsnapshot import claims

          path = Path('CLAUDE.md')
          text = path.read_text(encoding='utf-8')
          derived = claims.derive_all()
          for claim in claims.CLAIMS:
              if claim.name not in derived.values:
                  raise SystemExit(f'cannot derive snapshot claim {claim.name}')
              value = derived.values[claim.name] + (1 if claim.name == 'commits' else 0)
              match = re.search(claim.pattern, text)
              if not match:
                  raise SystemExit(f'snapshot pattern absent for {claim.name}')
              start, end = match.span(1)
              text = text[:start] + str(value) + text[end:]
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          python scripts/sov_clarity.py record CLAUDE.md --changed
          python scripts/sov_clarity.py check
          python scripts/sov_docs.py build

      - name: Commit the final shaped readiness definition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .clarity/coverage.json \
            PRD.md SPEC.md CLAUDE.md \
            archives/SPEC-PHASE-I-TERMINAL.txt \
            contracts/phases.json contracts/README.md contracts/custody.schema.json \
            contracts/record-projection.schema.json contracts/finding.schema.json \
            conformance/fixtures/commissioning/evidence-contract-cases.json \
            scripts/tests/test_commissioning_evidence_contracts.py \
            diagrams/source-reader-recording.md diagrams/crossing-typology.md \
            diagrams/requirement-lifecycle.md \
            docs/documentation.html
          git add -u .github/workflows/gap-195-readiness-definition.yml
          if git diff --name-only --diff-filter=U | grep -q .; then
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git commit -m 'feat(gap): prepare Phase 1.5 commissioning definition'

      - name: Prove historical pin and new evidence contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest scripts.tests.test_commissioning_evidence_contracts
          python scripts/sov_custody.py phase
          python scripts/sov_custody.py reconcile
          python scripts/sov_f2_gate.py --json >/tmp/phase-i-f2.json || true
          python - <<'PY'
          from __future__ import annotations
          from hashlib import sha256
          from pathlib import Path
          import json

          phases = json.loads(Path('contracts/phases.json').read_text(encoding='utf-8'))
          phase_i = phases['phases'][0]
          pin = next(item for item in phase_i['definition']
                     if item['document'] == 'archives/SPEC-PHASE-I-TERMINAL.txt')
          actual = 'sha256:' + sha256(Path(pin['document']).read_bytes()).hexdigest()
          if actual != pin['digest']:
              raise SystemExit(f'historical SPEC archive drifted: {actual} != {pin["digest"]}')
          if phase_i['succeeded_by'] is not None:
              raise SystemExit('readiness definition opened a successor by implication')
          if 'phase: NONE_ACTIVE' not in Path('STATUS.yaml').read_text(encoding='utf-8'):
              raise SystemExit('readiness definition changed active phase state')
          PY

      - name: Full repository verification on committed state
        shell: bash
        run: |
          set -euo pipefail
          python scripts/sov_diagrams.py
          python scripts/sov_docs.py check
          python scripts/sov_clarity.py check
          python scripts/lint.py
          python scripts/verify.py
          test -z "$(git status --porcelain)"

      - name: Push only the verified readiness definition
        run: git push origin HEAD:gap/195-participant-isolation
