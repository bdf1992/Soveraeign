name: gap-derived-commit

on:
  push:
    branches:
      - chore/gap-phase-synthesis

permissions:
  contents: write

jobs:
  commit-derived:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh seam clarity receipt
        run: python scripts/sov_clarity.py record OPEN-SEAMS.md --changed
      - name: Rebuild documentation reader
        run: python scripts/sov_docs.py build
      - name: Commit only derived outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .clarity/coverage.json docs/documentation.html
          if git diff --cached --quiet; then
            echo "derived outputs already current"
            exit 0
          fi
          git commit -m "chore(gap): refresh derived clarity and docs"
          git push origin HEAD:chore/gap-phase-synthesis
