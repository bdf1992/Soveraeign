name: gap-owner-finalize

on:
  push:
    branches:
      - chore/gap-phase-synthesis

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply owner-accepted gap facts
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"missing replacement target in {path}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          replace(
              "AGENTS.md",
              "The governing documents form one design System of Record with explicit roles,\n"
              "in two groups. Two of them say what product this is; the rest say what the\n"
              "current system requires and how it is built. No phase is active. Historical\n"
              "phase material is evidence only, and `contracts/SUCCESSOR-PREP.md` records the\n"
              "closed-books residue without granting successor standing. Treating historical\n"
              "phase evidence as current authority is a category error.",
              "The governing documents define repository invariants and boundary rules. When a\n"
              "phase is active, phase contracts define that phase's qualification gates. No\n"
              "phase is active. Historical phase material is evidence only, and\n"
              "`contracts/SUCCESSOR-PREP.md` records the closed-books residue without granting\n"
              "successor standing. Treating historical phase evidence as current authority is\n"
              "a category error.",
          )

          replace(
              "contracts/SUCCESSOR-PREP.md",
              "The three residue lists above remain pending explicit owner acceptance.",
              "The root seat formally accepts all three residue lists above: the kept invariants exactly as listed; built-but-unwitnessed residue grounded strictly in current `STATUS.yaml` machine standings rather than retrospective summaries; and the terminal X1-X5 measured gaps exactly as preserved above. The residue-acceptance condition is satisfied.",
          )

          replace(
              "contracts/SUCCESSOR-PREP.md",
              "No successor phase is open. `STATUS.yaml` must remain `phase: NONE_ACTIVE`. Any future phase must be opened by the root seat against this document only after the residue lists are owner-accepted, every seam is closed or explicitly carried, and clarity coverage on the declared governing population is current.",
              "No successor phase is open. `STATUS.yaml` must remain `phase: NONE_ACTIVE`. The gap conditions recorded here are satisfied: the residue lists are owner-accepted, every surviving seam is explicitly carried or closed, and clarity coverage on the declared governing population is current. Any future phase still requires a separate explicit opening act by the root seat against this document.",
          )
          PY

      - name: Refresh affected clarity receipt
        run: |
          python scripts/sov_clarity.py record AGENTS.md --changed
          python scripts/sov_clarity.py check

      - name: Require declared 17 of 17 current
        run: |
          python - <<'PY'
          import json
          import subprocess

          required = [
              "README.md", "GROUND.md", "CANON.md", "SYSTEM.md", "CONTRACT.md",
              "AGENTS.md", "PRD.md",
              "services/asset/CHARTER.md", "services/console/CHARTER.md",
              "services/gateway/CHARTER.md", "services/host/CHARTER.md",
              "services/identity/CHARTER.md", "services/observation/CHARTER.md",
              "services/projection/CHARTER.md", "services/proofing/CHARTER.md",
              "services/record/CHARTER.md", "services/registry/CHARTER.md",
          ]
          states = json.loads(subprocess.check_output(
              ["python", "scripts/sov_clarity.py", "status", "--json"], text=True
          ))
          bad = {path: states.get(path) for path in required if states.get(path) != "CURRENT"}
          if bad:
              raise SystemExit(f"gap clarity population is not 17/17 CURRENT: {bad}")
          print("PASS: declared gap clarity population is 17/17 CURRENT")
          PY

      - name: Rebuild documentation reader
        run: python scripts/sov_docs.py build

      - name: Preserve no-active-phase state
        run: |
          grep -qx 'phase: NONE_ACTIVE' STATUS.yaml
          grep -qx 'next_gate: SUCCESSOR_PHASE_OPENING' STATUS.yaml
          echo 'PASS: phase remains NONE_ACTIVE with SUCCESSOR_PHASE_OPENING gate'

      - name: Remove temporary workflow before verification
        run: git rm .github/workflows/gap-owner-finalize.yml

      - name: Run repository verification gate
        run: python scripts/verify.py

      - name: Commit final gap state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(gap): record owner acceptance and close gap"
          git push origin HEAD:chore/gap-phase-synthesis
