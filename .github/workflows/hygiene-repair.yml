name: hygiene repair

# The root verification here retains its per-check Observation records rather than
# reducing the run to an exit code; see the header of `.github/workflows/verify.yml`.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: hygiene-repair-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Hygiene defeating tests
        run: python -m unittest scripts.tests.test_lint -v
      - name: Repository hygiene
        run: python scripts/lint.py
      - name: Root verification
        run: python scripts/verify.py --observe "$RUNNER_TEMP/hygiene-observations.json"
      - name: Retain what the root verification observed
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: hygiene-observations-${{ github.sha }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/hygiene-observations.json
          if-no-files-found: error
          retention-days: 30
