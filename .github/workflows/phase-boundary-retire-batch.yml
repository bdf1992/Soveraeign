name: phase boundary retire proven refs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase-boundary-retire-batch.yml

permissions:
  contents: write

concurrency:
  group: phase-boundary-retire-proven-refs
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build owner-approved closure batch
        env:
          ACTIONS_PATH: ${{ runner.temp }}/phase-boundary-retire-actions.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          branches = [
              "phase-boundary/closure-ledger",
              "DO-NOT-USE",
              "DELETE-ME",
              "wt/pr43",
              "wt/principal-identity",
              "wt/pr59-merge-main",
              "docs/verification-budget",
              "feat/verification-channels",
              "feat/record-witness-surface",
              "fix/custody-tests-declare-posix",
              "feat/status-claims-typed",
              "chore/status-and-projection-bookkeeping",
              "backup/fed-local-18-20260824",
              "fix/verification-budget-tooling-shards",
              "fix/verification-budget-five-tooling-shards",
              "feat/phase-i-local-infrastructure",
              "feat/phase-i-runtime-image-contract",
              "fix/landing-gate-host-independence",
              "feat/console-authority-enforced",
              "feat/human-binding-affordances",
              "feat/composable-human-surface",
              "feat/surface-session-presence",
              "rescue/human-collection-substrate",
              "queue-agent-controller",
              "feat/6-shared-kernel-transitions",
              "feat/work-coordination-kernel-participant",
          ]
          assert len(branches) == 26
          assert len(set(branches)) == 26
          assert "main" not in branches

          actions = []
          for index, branch in enumerate(branches, 1):
              actions.append({
                  "id": f"phase-boundary-delete-{index:03d}",
                  "kind": "BRANCH_DELETE",
                  "target": branch,
                  "argument": branch,
                  "effect_class": "EXTERNAL_WORLD",
                  "evidence": "Issue #148 records an evidence-backed terminal disposition before this batch",
                  "rule": "Issue #148 phase-boundary closure: branches are execution state, not durable intent",
                  "recommendation": "delete the remote ref; preserve meaning in main, PR/commit history, or owning ticket",
              })
          Path(os.environ["ACTIONS_PATH"]).write_text(
              json.dumps(actions, indent=2) + "\n", encoding="utf-8", newline="\n"
          )
          print(f"prepared {len(actions)} exact branch-retirement actions")
          PY

      - name: Retire through the repository GitHub write crossing
        id: apply
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIONS_PATH: ${{ runner.temp }}/phase-boundary-retire-actions.json
          RECEIPTS_PATH: ${{ runner.temp }}/phase-boundary-retire-receipts.json
        run: |
          python adapters/github/apply.py \
            --repo "$GITHUB_REPOSITORY" \
            --actions "$ACTIONS_PATH" \
            --receipts "$RECEIPTS_PATH"

      - name: Publish exact actions and receipts
        if: always()
        env:
          ACTIONS_PATH: ${{ runner.temp }}/phase-boundary-retire-actions.json
          RECEIPTS_PATH: ${{ runner.temp }}/phase-boundary-retire-receipts.json
        run: |
          echo "## Phase-boundary branch retirement" >> "$GITHUB_STEP_SUMMARY"
          echo "Issue #148 is the durable disposition ledger. This run executes only its proven terminal batch." >> "$GITHUB_STEP_SUMMARY"
          echo "### Actions" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$ACTIONS_PATH" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### Receipts" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RECEIPTS_PATH" ]; then cat "$RECEIPTS_PATH"; else echo '[]'; fi >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Require every retirement to produce APPLIED
        if: always()
        env:
          RECEIPTS_PATH: ${{ runner.temp }}/phase-boundary-retire-receipts.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["RECEIPTS_PATH"])
          if not path.exists():
              raise SystemExit("retirement batch produced no receipt file")
          receipts = json.loads(path.read_text(encoding="utf-8"))
          failed = [r for r in receipts if r.get("outcome") != "APPLIED"]
          print(f"{len(receipts) - len(failed)}/{len(receipts)} retirement actions APPLIED")
          if failed:
              for item in failed:
                  print(item)
              raise SystemExit(1)
          PY
