name: pr206 derived refresh

on:
  push:
    branches:
      - gap/compress-readme-concern-entry

permissions:
  contents: write

concurrency:
  group: pr206-derived-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: gap/compress-readme-concern-entry

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconcile current main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Rebuild owned derived readers
        run: |
          set -euo pipefail
          python scripts/sov_docs.py build
          python scripts/sov_clarity.py record README.md --changed
          git add docs/documentation.html .clarity/coverage.json
          if git diff --cached --quiet; then
            echo "No derived refresh was needed."
          else
            git commit -m "chore(gap): refresh README derived readers"
          fi

      - name: Verify refreshed branch
        run: |
          set -euo pipefail
          python scripts/sov_clarity.py zero
          python scripts/sov_docs.py check
          python scripts/verify.py
          python scripts/lint.py

      - name: Push verified reconciliation
        run: git push origin HEAD:gap/compress-readme-concern-entry
