name: prep Phase 1.5 cold-start readiness

on:
  push:
    branches:
      - prep/phase-1-5-cold-start

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: prep/phase-1-5-cold-start

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply cold-start readiness slice
        run: |
          python scripts/_prep_cold_start_patch.py
          python scripts/_prep_cold_start_fix.py

      - name: Remove carrier from final tree
        run: rm .github/workflows/prep-phase-1-5-cold-start.yml scripts/_prep_cold_start_patch.py scripts/_prep_cold_start_fix.py

      - name: Rebuild derived repository projections
        run: |
          python scripts/sov_surface.py render
          python scripts/sov_docs.py build
          python - <<'PY'
          import json
          import subprocess

          status = subprocess.run(
              ["python", "scripts/sov_clarity.py", "status", "--json"],
              check=True, capture_output=True, text=True)
          states = json.loads(status.stdout)
          for path, state in states.items():
              if state not in {"TEXT_STALE", "BASIS_STALE", "UNCHECKED"}:
                  continue
              changed = subprocess.run(
                  ["git", "diff", "--quiet", "--", path], check=False).returncode != 0
              command = ["python", "scripts/sov_clarity.py", "record", path]
              if changed:
                  command.append("--changed")
              subprocess.run(command, check=True)
          PY
          python scripts/sov_clarity.py gate

      - name: Focused cold-start checks
        run: |
          python scripts/tests/test_phase15_cold_start.py
          python scripts/tests/test_session_phase_context.py
          python scripts/tests/test_sov_next.py
          python scripts/sov_session.py selfcheck
          python scripts/sov_opening_readiness.py --require-ready
          python scripts/sov_next.py --strict
          git diff --check

      - name: Repository checks
        run: |
          python scripts/lint.py
          python scripts/verify.py

      - name: Commit and push final self-cleaned tree
        run: |
          git config user.name "bdf1992"
          git config user.email "bdf1992.fb@gmail.com"
          git add -A
          git commit -m "prep: align cold-start context with phase authority"
          git push origin HEAD:prep/phase-1-5-cold-start
