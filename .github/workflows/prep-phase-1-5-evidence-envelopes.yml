name: prep Phase 1.5 evidence envelopes

on:
  push:
    branches:
      - prep/phase-1-5-evidence-envelopes

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: prep/phase-1-5-evidence-envelopes

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recover and apply evidence-envelope readiness slice
        run: |
          git fetch origin archive/prep-phase-1-5-evidence-carrier:refs/remotes/origin/archive/prep-phase-1-5-evidence-carrier
          git show origin/archive/prep-phase-1-5-evidence-carrier:scripts/_prep_evidence_envelopes.py > scripts/_prep_runtime.py
          git show origin/archive/prep-phase-1-5-evidence-carrier:scripts/_prep_evidence_fix.py > scripts/_prep_fix_runtime.py
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/_prep_runtime.py')
          text = path.read_text(encoding='utf-8')
          old = 'evidence comparison is not one classified NO_CONFLICT'
          new = 'evidence comparison is not a single NO_CONFLICT classification'
          if old not in text:
              raise SystemExit('expected compatibility phrase missing from recovered carrier')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          python scripts/_prep_runtime.py
          python scripts/_prep_fix_runtime.py

      - name: Remove carrier from final tree
        run: rm .github/workflows/prep-phase-1-5-evidence-envelopes.yml scripts/_prep_runtime.py scripts/_prep_fix_runtime.py

      - name: Rebuild derived repository projections
        run: |
          python scripts/sov_surface.py render
          python scripts/sov_docs.py build
          python - <<'PY'
          import json
          import subprocess

          status = subprocess.run(
              ['python', 'scripts/sov_clarity.py', 'status', '--json'],
              check=True, capture_output=True, text=True)
          states = json.loads(status.stdout)
          for path, state in states.items():
              if state not in {'TEXT_STALE', 'BASIS_STALE', 'UNCHECKED'}:
                  continue
              changed = subprocess.run(
                  ['git', 'diff', '--quiet', '--', path], check=False).returncode != 0
              command = ['python', 'scripts/sov_clarity.py', 'record', path]
              if changed:
                  command.append('--changed')
              subprocess.run(command, check=True)
          PY
          python scripts/sov_clarity.py gate

      - name: Focused evidence checks
        run: |
          python scripts/tests/test_commissioning_evidence_workflow.py
          python scripts/tests/test_sov_loop.py
          node --check .claude/workflows/sov-loop.js
          python scripts/sov_session.py selfcheck
          python scripts/sov_opening_readiness.py --require-ready
          git diff --check

      - name: Repository checks
        run: |
          python scripts/lint.py
          python scripts/verify.py

      - name: Commit and push final self-cleaned tree
        run: |
          git config user.name "bdf1992"
          git config user.email "bdf1992.fb@gmail.com"
          git add -A
          git commit -m "prep: make commissioning evidence fail honestly"
          git push origin HEAD:prep/phase-1-5-evidence-envelopes
