name: prep Phase 1.5 concern-scoped sessions

on:
  push:
    branches:
      - prep/phase-1-5-session-concerns

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: prep/phase-1-5-session-concerns

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply concern/session readiness slice
        run: python scripts/_prep_concern_patch.py

      - name: Remove carrier from final tree
        run: rm .github/workflows/prep-phase-1-5-session-concerns.yml scripts/_prep_concern_patch.py

      - name: Focused session and workflow checks
        run: |
          python scripts/tests/test_session_concerns.py
          python scripts/sov_session.py selfcheck
          node --check .claude/workflows/sov-loop.js
          python scripts/sov_opening_readiness.py --require-ready
          git diff --check

      - name: Repository checks
        run: |
          python scripts/lint.py
          python scripts/verify.py

      - name: Commit and push final self-cleaned tree
        run: |
          git config user.name "bdf1992"
          git config user.email "bdf1992.fb@gmail.com"
          git add -A
          git commit -m "prep: bind sessions to open concerns"
          git push origin HEAD:prep/phase-1-5-session-concerns
