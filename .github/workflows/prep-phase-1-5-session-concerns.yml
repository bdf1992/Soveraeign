## Concern-scoped sessions

Repository sessions expose a small internal work console with `python
scripts/sov_session.py console`. Every live session carries one concern address,
optional source-session lineage, source references, and available queue
references. Those values attribute and route attention; they never grant
authority or custody. The concern namespace and `.claude/skills/` discovery are
open, so adding a concern or skill does not require editing a central enum.

When a session discovers work for another concern, record the edge with `python
scripts/sov_session.py route --to <concern> --source <address>`. The route is
append-preserving host coordination with `authority_effect: NONE` and
`custody_effect: NONE`; destination intake remains separate. Controller,
Orchestrator, Worker, and Witness inherit the source concern through `sov-loop`
and are rejected only if they silently change that binding, not because a
concern/domain word is unfamiliar.
''')

