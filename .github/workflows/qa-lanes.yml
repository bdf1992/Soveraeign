name: qa lanes

# The verification dyad from SDLC.md, run per pull request.
#
#   blue   is candidate construction evidence CI(C): it checks the exact PR head,
#          builds the positive path and its declared cases, and a pass establishes
#          BUILT evidence and nothing further
#   red    screens the same candidate adversarially; its output is PROPOSED findings,
#          never CONFIRMED, because a finding counts only after independent reproduction
#   purple gates any standing advance past BUILT on the candidate engagement receipt
#
# Base+candidate integration evidence CI(B,C) is a separate repository subject and
# is produced by verify.yml's repository matrix (plus supporting integration jobs).
# Neither lane transfers its result to the other subject.
#
# Mutation execution is intentionally not on this critical path. This workflow
# admits the exact candidate mutation work quickly; `.github/workflows/mutation-evidence.yml`
# performs the expensive experiments asynchronously against landed immutable bytes.
# No job here ratifies.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: qa-lanes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blue:
    name: blue · construction (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Bind Blue to the exact candidate
        run: >-
          python scripts/sov_ci_subject.py candidate
          --base "${{ github.event.pull_request.base.sha }}"
          --candidate "${{ github.event.pull_request.head.sha }}"
          --output "$RUNNER_TEMP/blue-candidate-subject.json"
      - name: Retain Blue candidate subject receipt
        uses: actions/upload-artifact@v4
        with:
          name: blue-candidate-subject-${{ github.event.pull_request.head.sha }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/blue-candidate-subject.json
          if-no-files-found: error
          retention-days: 30
      - name: Repository verification
        run: python scripts/verify.py
      - name: Record the standing this establishes
        if: always()
        run: |
          {
            echo '## Blue lane'
            echo
            echo "Python ${{ matrix.python-version }} is one supported reading of candidate CI(C)."
            echo 'The Blue matrix establishes `BUILT` evidence only when every supported reading passes.'
            echo 'It establishes nothing about the base+candidate integration subject, and it is not a witness or ratification.'
          } >> "$GITHUB_STEP_SUMMARY"

  blue-required:
    name: blue · construction
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [blue]
    steps:
      - name: Publish the protected-branch check
        run: echo 'Both supported Python readings completed successfully against the exact candidate.'

  generative-red:
    name: red · generative screening
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: vars.SOV_RED_LANE_ENABLED == 'true'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Bind Red to the exact candidate
        run: >-
          python scripts/sov_ci_subject.py candidate
          --base "${{ github.event.pull_request.base.sha }}"
          --candidate "${{ github.event.pull_request.head.sha }}"

      - name: Refuse an enabled lane with no key
        env:
          RED_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$RED_KEY" ]; then
            echo 'RED_LANE_MISCONFIGURED - SOV_RED_LANE_ENABLED is true but ANTHROPIC_API_KEY is absent.' >&2
            echo 'Failing rather than reporting a pass for screening that never ran.' >&2
            exit 1
          fi

      - name: Adversarial screening pass
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Hold the RED stance defined in SDLC.md over this pull request's exact candidate commit.

            You receive the contract, the claimed invariants, and the built artifact.
            Do not read the author's tests, plan, or assumptions as evidence that the
            behavior is correct, and do not import participant implementation code
            into your reasoning about the oracle.

            Attempt to defeat the change. Look specifically for refusal bypasses,
            authority escalation, stale-source use, provenance gaps, retraction that
            erases history, projections treated as authoritative, effect classes
            widened without a decision, and any defeat the builder did not anticipate.

            Report each candidate as a PROPOSED finding with an identifier of the form
            RED-<issue>-<nnn>, a one-line summary, and the exact reproduction steps.
            State plainly that these are proposals: a finding counts only after it
            reproduces under observation independent of you, and only after it lands
            as a permanent defeating fixture in the conformance corpus.

            Do not claim a finding is confirmed. Do not claim the change is witnessed.
            Do not approve the pull request.

  mutation-admission:
    name: mutation · admission
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bind mutation admission to the exact candidate
        run: >-
          python scripts/sov_ci_subject.py candidate
          --base "${{ github.event.pull_request.base.sha }}"
          --candidate "${{ github.event.pull_request.head.sha }}"
      - name: Fetch the comparison point
        run: git fetch --no-tags origin "${{ github.base_ref || 'main' }}"
      - name: Prove the instrument discriminates
        run: python scripts/sov_mutate.py selfcheck
      - name: Admit exact mutation work
        run: |
          python scripts/sov_mutate.py plan \
            --base "origin/${{ github.base_ref || 'main' }}" \
            | tee mutation-plan.json
      - name: Publish admission summary
        if: always()
        run: |
          {
            echo '## Mutation admission'
            echo
            echo 'This check proves the candidate diff can be scoped and every changed production Python target has an owning suite.'
            echo 'It does not execute the expensive mutants and does not claim a mutation score.'
            echo 'Mutation execution runs asynchronously after landing against immutable landed bytes.'
          } >> "$GITHUB_STEP_SUMMARY"

  red:
    name: red · adversarial screening
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [generative-red, mutation-admission]
    if: ${{ !cancelled() && needs.mutation-admission.result == 'success'
            && needs.generative-red.result != 'failure' }}
    steps:
      - name: Publish the protected-branch check
        run: |
          echo 'Mutation work was honestly admitted against the exact candidate; expensive mutation execution is asynchronous evidence.'
          echo 'Optional generative screening was either successful or not enabled.'

  purple:
    name: purple · release gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [blue-required, red]
    if: ${{ !cancelled() && needs.blue-required.result == 'success'
            && needs.red.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bind the gate to the exact candidate
        run: >-
          python scripts/sov_ci_subject.py candidate
          --base "${{ github.event.pull_request.base.sha }}"
          --candidate "${{ github.event.pull_request.head.sha }}"

      - name: Capture the proposed transition
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          mkdir -p .local/pr
          printf '%s' "$BODY" > .local/pr/body.md

      - name: Evaluate the proposed standing change
        run: python scripts/sov_ticket.py transition --body .local/pr/body.md

      - name: Record the gate outcome
        if: always()
        run: |
          {
            echo '## Purple gate'
            echo
            echo 'This gate is bound to the exact candidate CI(C), not the synthetic integration commit.'
            echo 'A pull request that proposes no standing change passes this gate and establishes `BUILT` evidence only.'
            echo 'A pull request that proposes an advance past `BUILT` must carry a settled engagement receipt with an independent witness.'
            echo '`RATIFIED` is unreachable here by design.'
          } >> "$GITHUB_STEP_SUMMARY"
