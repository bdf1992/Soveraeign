name: qa lanes

# The verification dyad from SDLC.md runs at two cadences.
#
#   blue       runs per pull request. It proves the declared positive and
#              defeating cases and establishes BUILT evidence only.
#   red        is dispatched over a named milestone and immutable target. Its
#              output is screening evidence and PROPOSED findings; it is not an
#              independent witness receipt by itself.
#   standing   guards any requested standing transition. A PR may continue
#              ordinary engineering at BUILT without running Red; a request to
#              reach WITNESSED must already carry the independent receipts the
#              transition contract requires.
#
# No job here ratifies. Ratification reaches the repository through owner
# acceptance, not a check.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      milestone:
        description: Named milestone or surface being attacked
        required: true
        type: string
      target_ref:
        description: Immutable target commit, tag, or branch to inspect
        required: true
        type: string
      base_ref:
        description: Comparison point preceding the milestone
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: qa-lanes-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blue:
    name: blue · construction (${{ matrix.python-version }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Repository verification
        run: python scripts/verify.py
      - name: Record the standing this establishes
        if: always()
        run: |
          {
            echo '## Blue lane'
            echo
            echo "Python ${{ matrix.python-version }} is one supported reading of the same root observation."
            echo 'The Blue matrix establishes `BUILT` evidence only when every supported reading passes.'
            echo 'It is not a witness and it is not a ratification.'
            echo 'Remaining at BUILT does not stop later reachable engineering work.'
          } >> "$GITHUB_STEP_SUMMARY"

  blue-required:
    name: blue · construction
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [blue]
    steps:
      - name: Publish the protected-branch check
        run: echo 'Both supported Python readings completed successfully.'

  standing:
    name: purple · standing transition guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [blue-required]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture the proposed transition
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          mkdir -p .local/pr
          printf '%s' "$BODY" > .local/pr/body.md

      - name: Evaluate the proposed standing change
        run: python scripts/sov_ticket.py transition --body .local/pr/body.md

      - name: Record the gate outcome
        if: always()
        run: |
          {
            echo '## Standing transition guard'
            echo
            echo 'This pull request runs Blue, not milestone Red.'
            echo 'A PR that proposes no standing change establishes `BUILT` evidence only.'
            echo 'A request to advance to `WITNESSED` must carry an already settled'
            echo 'independent witness and PURPLE receipt. Ordinary work may continue at BUILT.'
            echo '`RATIFIED` remains unreachable here by design.'
          } >> "$GITHUB_STEP_SUMMARY"

  milestone-generative-red:
    name: milestone · red generative screening
    if: github.event_name == 'workflow_dispatch' && vars.SOV_RED_LANE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - name: Refuse an enabled lane with no key
        env:
          RED_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$RED_KEY" ]; then
            echo 'RED_LANE_MISCONFIGURED - SOV_RED_LANE_ENABLED is true but ANTHROPIC_API_KEY is absent.' >&2
            echo 'Failing rather than reporting a pass for screening that never ran.' >&2
            exit 1
          fi

      - name: Adversarial milestone screening pass
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Hold the RED stance defined in SDLC.md over the named milestone
            "${{ inputs.milestone }}" at target ref "${{ inputs.target_ref }}".

            The checkout is the immutable target you are attacking. Work from the
            governing contracts, claimed invariants, and built artifact. Do not use
            the builder's tests, plan, or assumptions as evidence and do not import
            participant implementation code into your oracle.

            Attempt to defeat the accumulated milestone surface. Look for refusal
            bypasses, authority escalation, stale-source use, provenance gaps,
            retraction that erases history, projections treated as authoritative,
            effect classes widened without a decision, and any defeat the builders
            did not anticipate.

            Report candidate findings as PROPOSED with exact reproduction steps.
            Do not claim a finding is confirmed, do not claim this workflow is the
            independent witness receipt, and do not claim the milestone is WITNESSED.

  milestone-mutation:
    name: milestone · red mutation score
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the milestone comparison point
        run: git fetch --no-tags origin "${{ inputs.base_ref }}"

      - name: Prove the scorer discriminates before trusting its number
        run: python scripts/sov_mutate.py selfcheck

      - name: Score the Python surface accumulated by this milestone
        run: |
          python scripts/sov_mutate.py run \
            --changed \
            --base "${{ inputs.base_ref }}" \
            --limit 40 \
            --total-limit 120

      - name: Record what the score means
        if: always()
        run: |
          {
            echo '## Milestone Red lane, mechanical'
            echo
            echo "Milestone: ${{ inputs.milestone }}"
            echo "Target: ${{ inputs.target_ref }}"
            echo "Comparison: ${{ inputs.base_ref }}"
            echo
            echo 'A mutation score is evidence about the tests, not a witness receipt.'
            echo 'A surviving mutant names behaviour the suite does not assert.'
            echo 'No threshold is invented here; the score is evidence for the engagement.'
          } >> "$GITHUB_STEP_SUMMARY"

  milestone-red:
    name: milestone · red screening
    if: ${{ always() && github.event_name == 'workflow_dispatch'
            && needs.milestone-mutation.result == 'success'
            && needs.milestone-generative-red.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [milestone-generative-red, milestone-mutation]
    steps:
      - name: Publish milestone screening result
        run: |
          echo 'Milestone adversarial screening completed.'
          echo 'Optional generative Red was either successful or not enabled.'
          echo 'This is input to a verification-engagement, not independent settlement.'
