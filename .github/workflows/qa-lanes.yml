name: qa lanes

# The verification dyad from SDLC.md, run per pull request.
#
#   blue   builds the positive path and its declared cases; a pass establishes BUILT
#          evidence and nothing further
#   red    screens adversarially; its output is PROPOSED findings, never CONFIRMED,
#          because a finding counts only after independent reproduction
#   purple gates any standing advance past BUILT on a settled engagement receipt
#
# No job here ratifies. Ratification reaches the repository through CODEOWNERS review
# on STATUS.yaml and decisions/, which is owner judgement, not a check.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: qa-lanes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blue:
    name: blue · construction
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository verification
        run: python scripts/verify.py
      - name: Record the standing this establishes
        if: always()
        run: |
          {
            echo '## Blue lane'
            echo
            echo 'A passing Blue lane establishes `BUILT` evidence only.'
            echo 'It is not a witness and it is not a ratification.'
          } >> "$GITHUB_STEP_SUMMARY"

  red:
    name: red · adversarial screening
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Gated at the job so an unconfigured lane renders as SKIPPED, not as a pass.
    # It previously exited zero after writing a refusal to the step summary, which
    # made a refusal and a real screening indistinguishable in the check list -
    # the defect named in decisions/0025. Generative screening stays optional; the
    # blocking adversarial gate is `mutation`, which needs no key.
    if: vars.SOV_RED_LANE_ENABLED == 'true'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse an enabled lane with no key
        env:
          RED_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$RED_KEY" ]; then
            echo 'RED_LANE_MISCONFIGURED - SOV_RED_LANE_ENABLED is true but ANTHROPIC_API_KEY is absent.' >&2
            echo 'Failing rather than reporting a pass for screening that never ran.' >&2
            exit 1
          fi

      - name: Adversarial screening pass
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Hold the RED stance defined in SDLC.md over this pull request's diff.

            You receive the contract, the claimed invariants, and the built artifact.
            Do not read the author's tests, plan, or assumptions as evidence that the
            behavior is correct, and do not import participant implementation code
            into your reasoning about the oracle.

            Attempt to defeat the change. Look specifically for refusal bypasses,
            authority escalation, stale-source use, provenance gaps, retraction that
            erases history, projections treated as authoritative, effect classes
            widened without a decision, and any defeat the builder did not anticipate.

            Report each candidate as a PROPOSED finding with an identifier of the form
            RED-<issue>-<nnn>, a one-line summary, and the exact reproduction steps.
            State plainly that these are proposals: a finding counts only after it
            reproduces under observation independent of you, and only after it lands
            as a permanent defeating fixture in the conformance corpus.

            Do not claim a finding is confirmed. Do not claim the change is witnessed.
            Do not approve the pull request.

  mutation:
    name: red · mutation score
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the comparison point
        run: git fetch --no-tags origin "${{ github.base_ref || 'main' }}"

      - name: Prove the scorer discriminates before trusting its number
        run: python scripts/sov_mutate.py selfcheck

      - name: Score the mutants this change admits
        run: |
          python scripts/sov_mutate.py run             --changed             --base "origin/${{ github.base_ref || 'main' }}"             --limit 40

      - name: Record what the score means
        if: always()
        run: |
          {
            echo '## Red lane, mechanical'
            echo
            echo 'A mutation score is evidence about the *tests*, not about the code.'
            echo 'A surviving mutant names a behaviour the suite does not assert.'
            echo
            echo 'This gate needs no key and cannot fail open: the scorer must first'
            echo 'demonstrate that it kills an asserted mutant and spares an unasserted'
            echo 'one, and a run that cannot prove it restored the tree refuses rather'
            echo 'than reporting a score.'
            echo
            echo 'Mutants per file are capped at 40 and the cap is reported, never silent.'
            echo 'No threshold is enforced yet - `decisions/0025` leaves the number to Bdo,'
            echo 'because a floor invented before a baseline would be asserted, not measured.'
          } >> "$GITHUB_STEP_SUMMARY"

  purple:
    name: purple · release gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [blue, red, mutation]
    # `red` is opt-in and renders as skipped when unconfigured, which must not
    # skip the gate behind it. A red that is enabled and *fails* still stops here.
    if: ${{ !cancelled() && needs.blue.result == 'success'
            && needs.mutation.result == 'success' && needs.red.result != 'failure' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture the proposed transition
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          mkdir -p .local/pr
          printf '%s' "$BODY" > .local/pr/body.md

      - name: Evaluate the proposed standing change
        run: python scripts/sov_ticket.py transition --body .local/pr/body.md

      - name: Record the gate outcome
        if: always()
        run: |
          {
            echo '## Purple gate'
            echo
            echo 'A pull request that proposes no standing change passes this gate and'
            echo 'establishes `BUILT` evidence only. A pull request that proposes an'
            echo 'advance past `BUILT` must carry a settled engagement receipt with an'
            echo 'independent witness. `RATIFIED` is unreachable here by design.'
          } >> "$GITHUB_STEP_SUMMARY"
