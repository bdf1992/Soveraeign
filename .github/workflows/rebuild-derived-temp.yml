name: rebuild derived temp

on:
  push:
    branches:
      - sov/milestone-witness-queue

permissions:
  contents: write

concurrency:
  group: rebuild-derived-milestone-witness
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sov/milestone-witness-queue
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild documentation projection
        run: python scripts/sov_docs.py build
      - name: Commit projection if it moved
        run: |
          if git diff --quiet -- docs/documentation.html; then
            echo "documentation projection already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/documentation.html
          git commit -m "docs: rebuild documentation projection"
          git push origin HEAD:sov/milestone-witness-queue
