name: reconcile open work probe

on:
  push:
    branches: [feat/human-collection-substrate]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe merge against main
        shell: bash
        run: |
          set +e
          git config user.name "Soveraeign reconciliation probe"
          git config user.email "reconcile@localhost"
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          rc=$?
          echo "MERGE_RC=$rc"
          echo "=== UNMERGED PATHS ==="
          git diff --name-only --diff-filter=U
          echo "=== STAGE BLOBS (base ours theirs) ==="
          git ls-files -u
          echo "=== COMBINED CONFLICT DIFF ==="
          git diff --cc --no-ext-diff
          exit 0
