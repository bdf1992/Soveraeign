name: refresh branch retirement docs

on:
  push:
    branches: [chore/automatic-branch-retirement]

permissions:
  contents: write

concurrency:
  group: refresh-branch-retirement-docs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/automatic-branch-retirement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild deterministic documentation
        run: python scripts/sov_docs.py build
      - name: Commit generated page if needed
        run: |
          if git diff --quiet -- docs/documentation.html; then
            echo 'documentation already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/documentation.html
          git commit -m 'docs: refresh documentation reader'
          git push origin HEAD:chore/automatic-branch-retirement
