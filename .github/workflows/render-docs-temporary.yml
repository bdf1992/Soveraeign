name: temporary documentation render

on:
  pull_request:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render documentation
        run: python scripts/sov_docs.py build
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-documentation
          path: docs/documentation.html
          if-no-files-found: error
          retention-days: 1
