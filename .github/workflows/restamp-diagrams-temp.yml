name: restamp diagrams temp

on:
  push:
    branches:
      - sov/milestone-witness-queue
    paths:
      - .github/workflows/restamp-diagrams-temp.yml

permissions:
  contents: write

jobs:
  restamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sov/milestone-witness-queue
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Re-read and stamp diagram provenance
        run: |
          python scripts/sov_diagrams.py stamp
          python scripts/sov_diagrams.py grade
      - name: Commit derived provenance if it moved
        run: |
          if git diff --quiet -- diagrams/; then
            echo "diagram provenance already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagrams/
          git commit -m "docs(diagrams): restamp STATUS provenance"
          git push origin HEAD:sov/milestone-witness-queue
