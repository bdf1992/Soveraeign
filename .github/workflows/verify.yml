name: verify

# Pull-request root verification lives in qa-lanes.yml's Blue matrix. Keeping a
# second pull_request trigger here made the same repository observation run a
# third time on every PR and multiplied one runner/timing defect into several
# red checks. This workflow verifies the merged main state and remains manually
# runnable for an explicit repository-wide observation.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify repository
        run: python scripts/verify.py
