# The founding decision docket is closed. O1-O22 no longer exist as identifiers:
# decisions/0024-open-decision-drain.md ruled O1-O13, O16, O17, O19, O20, and
# decisions/0033-close-the-founding-docket.md ruled the remainder that stood on
# concurrent branches. Standing now moves by evidence, not by asking.
open_decisions: []

external_acceptance_holds:
  - id: PUBLIC-CLEARANCE
    question: Does public commercial release have sufficient legal/domain/package/product collision clearance?
    blocks: public_release_only
    does_not_block: phase_i_engineering

# Canon identifiers follow the same rule as the founding docket: retired, not reserved.
# A promise whose meaning changes is retired and a new identifier minted, because work
# attributed under an identifier has to keep meaning what it meant when it was done.
retired_canon_ids:
  CANON-2: [PROMISE-13]
  CANON-3: [PROMISE-14]
  note: >-
    PROMISE-13 said proofing and was superseded by PROMISE-16, the durable claim
    underneath it. PROMISE-14 said standing a node up and was struck by Bdo with no
    successor: GROUND-016 carries the meaning and JOURNEY-12 keeps the gap.

retired_decision_ids:
  note: >-
    O1-O22 were founding-docket identifiers. They are retired, not reserved.
    A ruling is demoted by a defeating observation recorded in a new decision,
    never by reopening an identifier.
  ruled_by:
    decisions/0024-open-decision-drain.md: [O1, O2, O3, O4, O5, O6, O7, O8, O9, O10, O11, O12, O13, O16, O17, O19, O20]
    decisions/0033-close-the-founding-docket.md: [O14, O15, O18, O21, O22]

acceptance_policy:
  decision: decisions/0023-acceptance-not-approval.md
  drained_queue: decisions/0024-open-decision-drain.md
  docket_closure: decisions/0033-close-the-founding-docket.md
  unruled_proposals:
    - decisions/0034-spec-transition-refusal-codes.md
    - decisions/0055-closure-ownership.md
  ordinary_work_requires_preapproval: false
  owner_acceptance_requires_evidence: true
  owner_acceptance_requires_presentation: true
  presentation_goal: engaging_legible_nearly_self_evident_from_output
  resolution_rule: >-
    A decision is settled at the lowest tier that can produce evidence defeating
    the alternatives. Control rules boundary and sequencing questions, Work rules
    implementation questions, and only owner-held product intent, public naming,
    external commitment, and irreversible external-world effect reach Bdo.
  owner_actions:
    - ACCEPT
    - REJECT
    - STRIKE
    - REDIRECT

protected_boundaries:
  - evidence_files_are_immutable
  - product_name_changes_require_owner_acceptance
  - no_runtime_code_before_logical_spec_and_defeating_fixtures
  - no_whole_repository_imports
  - no_real_external_world_effects_in_phase_i
  - no_owner_impersonation
  - no_self_witnessing
  - no_self_acceptance_of_owner_judgement
  - no_secret_exposure

next_gate: EVIDENCE_PRODUCING_EXECUTION
