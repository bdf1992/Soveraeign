# The owner gate is acceptance of a finished result, not permission to begin
# (decisions/0028, which supersedes the prose in 0023 and 0024). A transition
# waits on an owner seat only for a reason contracts/acceptance-policy.json
# names. Everything else is drained below into a standing default the evidence
# under `counter` overturns, or presented as a finished result with a packet.
#
#   python scripts/sov_accept.py queue     what is waiting on which seat
#   python scripts/sov_accept.py audit     fails the build if anything waits without a reason
#
# The O-numbers are kept so the documents that cite them still resolve.
open_decisions: []

owner_acceptance_queue: []

