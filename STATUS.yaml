    reason: PUBLICATION
    blocks: repository.publish_public
    question: Does Soveraeign clear legal, domain, package, and product collision screening?
    reachable_alternative: Every Phase-I engineering task proceeds under the working name; no agent claims clearance.

rulings:
  - id: O7
    ruling: External effects are no longer refused by class. One is admitted inside a scope contracts/external-effect-authorization.json declares, using a verb that scope carries, leaving a receipt. Every refused verb stays refused. Compensation is forward only, and no receipt ever claims world rollback.
    counter: An effect admitted by a scope that turns out not to be reversible by the inverse it names, or a receipt claiming a rollback that did not occur.
  - id: O16b
    ruling: Label, project-field, state, and comment writes on this repository's own tickets, and pushing branches and opening pull requests, are authorised under coordination.issue_metadata and coordination.branch_write. Force-push, shared-branch deletion, branch-protection changes, visibility changes, secret writes, merging, and acting on any other repository are refused by name.
    counter: A coordination write that cannot be undone by the inverse verb its scope names, or an agent reaching a refused verb through a scope that admits it.
  - id: O3
    ruling: Bootstrap trust is explicit, local, and finite. A founding BootstrapGrant pins one attestor identity, validator version, capability, scope, validity window, and artifact revision, and may attest verification-typed claims only. Every later attestor resolves through ordinary authority lineage.
    counter: A fixture in which a bootstrap grant attests a judgement-typed claim, or in which a second attestor is admitted without lineage.
  - id: O4
    ruling: Historical reproduction and present applicability are separate objects. An Attestation is immutable evidence about an exact claim, input, and run. CurrentEffectiveness is a rebuildable projection over the ratified claim, applicable attestations, supersession, expiry, retraction, and policy. A recorded REPRODUCED result is never rewritten.
    counter: A case in which changed applicability rewrites a historical attestation, or in which effectiveness cannot be rebuilt from the record.
  - id: O5
    ruling: Gauge measures and projects governance state, authority pressure, unresolved rights, coverage, and evidence strength, and owns none of them. A Gauge score grants no authority, standing, or admission.
    counter: A case in which a Gauge score is read as a right to act, or in which evidence strength alone advances standing.
  - id: O6
    ruling: When a claim effectiveness policy requires runtime attestation, UNATTESTABLE keeps that claim out of EFFECTIVE while preserving its historical RATIFIED standing. A claim whose policy does not require attestation may stay effective, and the absence stays visible. No silent degrade from required to optional.
    counter: A case in which a required attestation quietly becomes optional, or in which UNATTESTABLE erases prior standing.
  - id: O8
    ruling: Semantic cold-start is observed as a named domain task performed by a fresh participant against exact held data, producing attributable outputs and receipts. Schema validity alone does not complete it. The FOUND-010 execution is admissible evidence.
    counter: A participant that passes the task while demonstrably missing the semantics, or a task that can be completed by schema conformance alone.
  - id: O9
    ruling: CLASSIFICATION.md is the canonical vocabulary contract for this phase, subject to versioned change.
    counter: A defeating fixture showing one term carrying two meanings across the governing set, or a term in use that the contract does not define.
  - id: O11
    ruling: Proofing Service is the second service boundary after Asset Service, at chartered standing.
    counter: A conformance case showing the proofing lifecycle is the asset lifecycle under another name.
  - id: O12
    ruling: The BYOM binding fields, data-boundary modes, and the two-model Phase-I fixture in contracts/model-binding.schema.json stand as declared.
    counter: A second adapter that cannot be described by the declared fields, or a data-boundary mode that admits a silent provider fallback.
  - id: O13
    ruling: The SDLC.md tiers, stance dyads, concern-registry derivation, and Red-gated release requirement stand as the operating loop, amended by decision 0028 so that ordinary work needs no pre-approval.
    counter: A run in which the declared loop cannot describe what actually happened, or in which Red gating blocks a release that carries no external effect.
  - id: O16
    ruling: contracts/ticket-transitions.json is the typed ticket workflow. Its outward-facing coordination steps stay held under O16b.
    counter: A ticket whose real lifecycle the table cannot express, or a declared transition with no positive and defeating case.
  - id: O17
    ruling: The Sov agency envelope, context declaration, and activation gates stand as declared in bindings/sov/. Loading Sov still grants no authority.
    counter: A fixture in which Sov widens its own grant, keeps private standing, or changes model silently and the declaration does not refuse it.
  - id: O19
    ruling: verification-engagement is a ticket kind, carrying engagement_id, a pinned target_pr and full-length target_head, and refusing construction identity on itself.
    counter: An engagement that must build to converge, or a target that cannot be pinned to an exact head.
  - id: O20
    ruling: contracts/kernel-transitions.json is the compiled statement of the SPEC.md transition contract. The ticket workflow and the Asset Service migrate onto it rather than keeping private transition rules.
    counter: A participant whose real transitions diverge from the compiled table, which scripts/sov_kernel.py parity would report.
  - id: O2b
    ruling: The baseline in ENGINEERING.md is a mechanism choice, not semantic authority, and may be replaced behind a proved contract without a new owner act.
    counter: A replacement that changes an observable contract rather than only the mechanism behind it.

acceptance_policy:
  contract: contracts/acceptance-policy.json
  seats: contracts/seat-registry.json
  decision: decisions/0028-acceptance-not-approval.md
  drain: decisions/0029-decision-queue-drain.md
  gate: acceptance
  ordinary_work_requires_preapproval: false
  audit: python scripts/sov_accept.py audit

protected_boundaries:
  - evidence_files_are_immutable
  - product_name_changes_require_owner_authority
  - no_runtime_code_before_logical_spec_and_defeating_fixtures
  - no_whole_repository_imports
  - no_external_effect_outside_a_declared_authorized_scope
  - no_external_effect_without_a_receipt
  - no_refused_verb_reachable_through_any_scope
  - no_claim_that_an_external_effect_was_rolled_back

next_gate: F0_FOUNDING_CLOSURE
