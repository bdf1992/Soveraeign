# under `counter` overturns, or presented as a finished result with a packet.
#
#   python scripts/sov_accept.py queue     what is waiting on which seat
#   python scripts/sov_accept.py audit     fails the build if anything waits without a reason
#
# The remaining queue is a non-blocking successor/product docket. None of these
# five items keeps historical phase:i open, authorizes a successor phase, or is
# part of the Phase-I boundary closure.
open_decisions: []

