# Bdo accepted the product ground on 2026-08-24 (decisions/0052). Sixteen claims say
# what product Soveraeign is, and revision GROUND-1 is now fixed: later work is
# attributed against those claims meaning what they mean at that revision. Accepting
# the ground is not a claim that the node keeps any of it - GROUND-010, a report is not
# an observation, is one the node presently cannot keep.
product_ground_status: OWNER_ACCEPTED_EPOCH_1_GROUND_1
# Accepted the same day with PROMISE-14 struck, which minted CANON-3. Standing a node
# up is a product experience beneath GROUND-016, not a durable promise; JOURNEY-12 is
# kept as a real gap. PROMISE-13 and PROMISE-14 are retired, not reserved.
product_canon_status: OWNER_ACCEPTED_CANON_3_PROMISE_13_AND_14_RETIRED
# JOURNEY-02 is served: console.discover-operations answers from the capability
# projection over IN_PROCESS, CLI and MCP, and a participant holding no session and no
# grant got an answer through the binding (decisions/0053). Four of the journey's five
# crossings are still declared and unreachable, so the journey is not walkable.
discovery_surface_status: BUILT_SERVED_ON_CLI_AND_MCP_JOURNEY_NOT_WALKABLE
# Every declared capability's authority is now answerable. Bdo ruled 2026-08-24 that
# archiving the thread needs its own grant, so console.archive-thread enforces
# archive:thread and the last declared/enforced divergence is closed (decisions/0054).
# The UNDETERMINABLE reading has no instance on this node and is kept under test.
console_authority_divergences: 0
# Reading the discovery surface's own output on 2026-08-24 found nine BUILT console
# operations that declare an authority and check none, console.grant and console.revoke
# among them: anyone reaching the service can write themselves a grant. The surface now
# reports them as NOT_ENFORCED and names them rather than reporting them as unanswerable.
# Seven of the nine are IN_PROCESS only, grant and revoke among them, so reaching them
# means already holding the service object rather than crossing a transport. The two wider
# ones are reads. Nothing was guarded: adding a check removes an ability from whoever can
# call them today, which is Bdo's call the way archive:thread was (decisions/0054).
console_built_operations_enforcing_no_authority: 9
# A receipt can now record what it served and what it consumed, and a work item can name
# the capability it serves. One real measured crossing resolves the whole chain from
# ground to usage. Nothing joins a work item to a run yet; the two meet at the capability.
attribution_join_status: BUILT_SELF_TESTED_ONE_MEASURED_TRACE_END_TO_END

