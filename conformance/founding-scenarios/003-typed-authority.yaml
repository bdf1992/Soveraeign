id: FOUND-003
title: typed_authority_refusal
status: SEED
given:
  - a delegated machine right scoped to verification_truth
  - one verification claim
  - one judgement claim
when:
  - the right attempts to accept both claims
then:
  - the verification claim may be accepted
  - the judgement claim is refused and receipted
defeating:
  - machine authority accepts the judgement claim
  - refusal leaves no receipt

