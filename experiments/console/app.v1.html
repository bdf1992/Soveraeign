<!doctype html>
<meta charset="utf-8">
<title>Soveraeign Console — v1</title>
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {
    --bg: #101014;        /* the ground */
    --rail: #0b0b0e;
    --col: #16161b;
    --main: #1a1a20;
    --side: #16161b;
    --line: #26262e;
    --ink: #e9e9ee;       /* 12.4:1 on --main */
    --dim: #a8a8b4;       /* 7.1:1  */
    --faint: #7c7c88;     /* 4.6:1  — the floor, measured, not eyeballed */
    --accent: #7fc0ac;
    --human: #d9a066;
    --model: #7fa8d9;
    --warn: #d97f6b;
    --ok: #7fc0ac;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.55 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    display: grid; grid-template-columns: 68px 264px 1fr 300px; height: 100vh; overflow: hidden;
  }
  .mono { font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace; }

  /* ---- node rail ---- */
  #rail { background: var(--rail); display: flex; flex-direction: column; align-items: center;
          padding: 12px 0; gap: 8px; border-right: 1px solid var(--line); }
  .node { width: 44px; height: 44px; border-radius: 14px; background: var(--col);
          display: grid; place-items: center; font-weight: 650; letter-spacing: -.02em;
          color: var(--accent); border: 1px solid var(--line); }
  .dom { width: 40px; height: 40px; border-radius: 50%; background: var(--col);
         display: grid; place-items: center; cursor: pointer; color: var(--dim);
         font-size: 12px; font-weight: 600; border: 1px solid transparent;
         transition: border-radius .18s, background .18s, color .18s; }
  .dom:hover { border-radius: 14px; color: var(--ink); background: #1f1f27; }
  .dom.on { border-radius: 14px; background: #232330; color: var(--ink); border-color: var(--line); }
  .dom.waiting { color: var(--human); }

  /* ---- channel column ---- */
  #col { background: var(--col); border-right: 1px solid var(--line);
         display: flex; flex-direction: column; overflow: hidden; }
  #colhead { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  #colhead h2 { margin: 0; font-size: 15px; font-weight: 620; letter-spacing: -.01em; }
  #colhead p { margin: 4px 0 0; font-size: 12px; color: var(--dim); line-height: 1.4; }
  #threads { overflow-y: auto; padding: 8px; flex: 1; }
  .th { padding: 9px 10px; border-radius: 7px; cursor: pointer; margin-bottom: 2px;
        border-left: 2px solid transparent; }
  .th:hover { background: #1e1e26; }
  .th.on { background: #24242e; border-left-color: var(--accent); }
  .th .t { font-size: 13px; line-height: 1.35; }
  .th .m { font-size: 11px; color: var(--faint); margin-top: 3px; display: flex; gap: 8px; }
  .th.unanswered .t { color: var(--human); }

  /* ---- thread ---- */
  #main { background: var(--main); display: flex; flex-direction: column; overflow: hidden; }
  #mainhead { padding: 13px 20px; border-bottom: 1px solid var(--line);
              display: flex; align-items: baseline; gap: 12px; }
  #mainhead h1 { margin: 0; font-size: 15px; font-weight: 620; letter-spacing: -.01em; }
  #pin { font-size: 11px; color: var(--faint); }
  #posts { flex: 1; overflow-y: auto; padding: 18px 20px 8px; }
  .post { display: grid; grid-template-columns: 38px 1fr; gap: 12px; margin-bottom: 20px; }
  .av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
        font-size: 13px; font-weight: 650; color: #12121a; }
  .av.HUMAN { background: var(--human); }
  .av.MODEL { background: var(--model); }
  .who { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; }
  .who b { font-size: 13.5px; font-weight: 620; }
  .kind { font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase;
          padding: 1px 5px; border-radius: 3px; border: 1px solid var(--line); color: var(--dim); }
  .when { font-size: 11px; color: var(--faint); }
  .body { white-space: pre-wrap; color: #dcdce4; }
  .prov { margin-top: 7px; font-size: 11px; color: var(--faint); display: flex;
          gap: 10px; flex-wrap: wrap; }
  .prov span { border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px; }

  /* ---- composer ---- */
  #composer { border-top: 1px solid var(--line); padding: 12px 20px 14px; }
  #box { display: flex; gap: 10px; align-items: flex-end; }
  textarea { flex: 1; resize: none; background: #22222b; color: var(--ink);
             border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
             font: inherit; min-height: 44px; max-height: 160px; }
  textarea:focus { outline: none; border-color: #3a3a48; }
  button { background: var(--accent); color: #0e1a16; border: 0; border-radius: 8px;
           padding: 11px 16px; font: inherit; font-weight: 620; cursor: pointer; }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: .45; cursor: default; filter: none; }
  #note { font-size: 11px; color: var(--faint); margin-top: 7px; }
  #receipt { margin-top: 8px; font-size: 11.5px; border-radius: 7px; padding: 8px 11px;
             border: 1px solid var(--line); background: #1e1e26; display: none; }
  #receipt.on { display: block; }
  #receipt.refused { border-color: var(--warn); }
  #receipt b { color: var(--ok); font-weight: 620; }
  #receipt.refused b { color: var(--warn); }

  /* ---- side ---- */
  #side { background: var(--side); border-left: 1px solid var(--line);
          overflow-y: auto; padding: 14px 16px; }
  h3 { font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase;
       color: var(--faint); margin: 0 0 8px; font-weight: 600; }
  .grp { margin-bottom: 22px; }
  .row { display: flex; justify-content: space-between; gap: 10px; font-size: 12px;
         padding: 3px 0; }
  .row span:last-child { color: var(--dim); text-align: right; }
  .op { font-size: 11.5px; padding: 4px 0; border-bottom: 1px solid #1e1e26; }
  .op b { font-weight: 600; }
  .op i { font-style: normal; color: var(--faint); }
  .member { display: flex; align-items: center; gap: 9px; padding: 4px 0; font-size: 12.5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.HUMAN { background: var(--human); } .dot.MODEL { background: var(--model); }
  .member i { font-style: normal; color: var(--faint); font-size: 11px; margin-left: auto; }
  #tick { font-size: 10.5px; color: var(--faint); line-height: 1.7; max-height: 190px;
          overflow-y: auto; }
  #tick div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .k-EVENT { color: var(--dim); } .k-RECEIPT { color: var(--faint); }
</style>

<nav id="rail"></nav>
<section id="col">
  <div id="colhead"><h2>—</h2><p></p></div>
  <div id="threads"></div>
</section>
<section id="main">
  <div id="mainhead"><h1>—</h1><div id="pin"></div></div>
  <div id="posts"></div>
  <div id="composer">
    <div id="box">
      <textarea id="text" placeholder="Answer here — this writes a record"></textarea>
      <button id="send">Post</button>
    </div>
    <div id="note"></div>
    <div id="receipt"></div>
  </div>
</section>
<aside id="side"></aside>

<script>
// The page holds no truth of its own. Everything rendered came from /api/state,
// which is a projection rebuilt from the journal on every call, and every act
// goes back through /api/call. Reloading loses nothing because nothing lives here.
const S = { state: null, ops: null, channel: null, thread: null };

const api = {
  async state() { return (await fetch('/api/state')).json(); },
  async operations() { return (await fetch('/api/operations')).json(); },
  async call(operation, inputs) {
    const r = await fetch('/api/call', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ operation, inputs })
    });
    return { ok: r.ok, status: r.status, payload: await r.json() };
  }
};

const who = id => S.state.operators.find(o => o.operator_id === id)
                  || { display: id, actor_kind: 'MODEL', role: '' };
const chan = id => S.state.channels.find(c => c.channel_id === id);
const threadsIn = id => S.state.threads.filter(t => t.channel_id === id);
const postsIn = id => S.state.posts.filter(p => p.thread_id === id);
const initials = name => name.replace(/^sov-/, '').slice(0, 2).toUpperCase();
const clock = ts => (ts || '').replace('T', ' ').replace('Z', '');
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};

// A thread in the judgement channel is unanswered until Bdo has posted in it.
// That is the whole state the surface needs to sort his queue by.
const answered = t => postsIn(t.thread_id).some(p => p.actor_kind === 'HUMAN');
const waiting = () => S.state.channels.filter(c => c.domain === 'judgement')
  .flatMap(c => threadsIn(c.channel_id)).filter(t => !answered(t));

function renderRail() {
  const rail = document.getElementById('rail');
  rail.replaceChildren();
  const node = el('div', 'node', 'S');
  node.title = S.state.node_id;
  rail.append(node, el('div', '', ''));
  for (const c of S.state.channels) {
    const b = el('div', 'dom' + (c.channel_id === S.channel ? ' on' : '')
      + (c.domain === 'judgement' ? ' waiting' : ''), initials(c.name));
    b.title = c.name + ' — ' + c.purpose;
    b.onclick = () => selectChannel(c.channel_id);
    rail.append(b);
  }
}

function renderColumn() {
  const c = chan(S.channel);
  document.querySelector('#colhead h2').textContent = c.name;
  document.querySelector('#colhead p').textContent = c.purpose;
  const list = document.getElementById('threads');
  list.replaceChildren();
  for (const t of threadsIn(S.channel)) {
    const open = !answered(t) && c.domain === 'judgement';
    const row = el('div', 'th' + (t.thread_id === S.thread ? ' on' : '') + (open ? ' unanswered' : ''));
    row.append(el('div', 't', t.title));
    const meta = el('div', 'm');
    meta.append(el('span', '', t.post_count + (t.post_count === 1 ? ' post' : ' posts')));
    if (open) meta.append(el('span', '', 'unanswered'));
    row.append(meta);
    row.onclick = () => selectThread(t.thread_id);
    list.append(row);
  }
}

function renderThread() {
  const t = S.state.threads.find(x => x.thread_id === S.thread);
  if (!t) {
    document.querySelector('#mainhead h1').textContent = 'No thread here yet';
    document.getElementById('pin').textContent = '';
    document.getElementById('posts').replaceChildren();
    return;
  }
  document.querySelector('#mainhead h1').textContent = t.title;
  document.getElementById('pin').textContent = t.pinned_address
    ? 'pinned to ' + t.pinned_address : 'not pinned to a record';
  const posts = document.getElementById('posts');
  posts.replaceChildren();
  for (const p of postsIn(S.thread)) {
    const person = who(p.actor_id);
    const wrap = el('div', 'post');
    wrap.append(el('div', 'av ' + p.actor_kind, initials(person.display)));
    const right = el('div');
    const line = el('div', 'who');
    line.append(el('b', '', person.display),
                el('span', 'kind', p.actor_kind === 'HUMAN' ? 'human' : 'model'),
                el('span', 'when', clock(p.posted_at)));
    right.append(line, el('div', 'body', p.body));
    const prov = el('div', 'prov mono');
    prov.append(el('span', '', p.standing));
    prov.append(el('span', '', p.content_digest.slice(0, 19)));
    if (p.proposal_id) prov.append(el('span', '', 'proposal'));
    prov.append(el('span', '', 'via ' + p.binding_id.replace('binding:', '')));
    right.append(prov);
    wrap.append(right);
    posts.append(wrap);
  }
  posts.scrollTop = posts.scrollHeight;
  document.getElementById('note').textContent =
    'Posting writes an EVENT and a RECEIPT to the journal as ' + who(bdo()).display
    + '. A console record enters at RECORDED; nothing here ratifies.';
}

const bdo = () => S.state.surface_session.operator_id;

function renderSide() {
  const side = document.getElementById('side');
  side.replaceChildren();
  const t = S.state.threads.find(x => x.thread_id === S.thread);

  const q = el('div', 'grp');
  q.append(el('h3', '', 'Waiting on you'));
  const open = waiting();
  if (!open.length) q.append(el('div', 'row', 'Nothing unanswered.'));
  for (const w of open) {
    const r = el('div', 'row');
    const a = el('span', '', w.title);
    a.style.cursor = 'pointer';
    a.onclick = () => { S.channel = w.channel_id; S.thread = w.thread_id; renderAll(); };
    r.append(a);
    q.append(r);
  }
  side.append(q);

  const d = el('div', 'grp');
  d.append(el('h3', '', 'This thread'));
  const rows = t ? [
    ['standing', 'RECORDED'],
    ['lifecycle', t.lifecycle],
    ['posts', String(t.post_count)],
    ['opened by', who(t.opened_by).display],
    ['pinned', t.pinned_address || 'not pinned'],
  ] : [];
  if (t && t.pinned_digest) rows.push(['digest', t.pinned_digest.slice(0, 22)]);
  for (const [k, v] of rows) {
    const r = el('div', 'row');
    r.append(el('span', '', k), el('span', 'mono', v));
    d.append(r);
  }
  side.append(d);

  const m = el('div', 'grp');
  m.append(el('h3', '', 'Operators'));
  for (const o of S.state.operators) {
    const row = el('div', 'member');
    row.append(el('div', 'dot ' + o.actor_kind), el('span', '', o.display), el('i', '', o.role));
    m.append(row);
  }
  side.append(m);

  const o = el('div', 'grp');
  o.append(el('h3', '', 'Operations this door exposes'));
  for (const op of S.ops.operations) {
    const row = el('div', 'op mono');
    row.append(el('b', '', op.operation.replace('console.', '')));
    row.append(el('i', '', ' ' + op.inputs.join(' ')));
    o.append(row);
  }
  side.append(o);

  const j = el('div', 'grp');
  j.append(el('h3', '', 'Journal — ' + S.state.counts.entries + ' entries'));
  const tick = el('div', 'tick mono');
  tick.id = 'tick';
  for (const e of S.state.journal.slice(-40).reverse()) {
    tick.append(el('div', 'k-' + e.kind,
      e.seq + '  ' + e.kind + '  ' + (e.record_kind || e.operation || e.outcome || '')));
  }
  j.append(tick);
  side.append(j);
}

function renderAll() {
  renderRail(); renderColumn(); renderThread(); renderSide();
}

function selectChannel(id) {
  S.channel = id;
  const list = threadsIn(id);
  S.thread = list.length ? list[0].thread_id : null;
  renderAll();
}
function selectThread(id) { S.thread = id; renderAll(); }

async function send() {
  const text = document.getElementById('text');
  const button = document.getElementById('send');
  const body = text.value.trim();
  if (!body) return;
  button.disabled = true;
  const result = await api.call('console.post', {
    session_id: S.state.surface_session.session_id,
    thread_id: S.thread, body
  });
  showReceipt(result);
  if (result.ok) { text.value = ''; await load(); }
  button.disabled = false;
}

function showReceipt(result) {
  const box = document.getElementById('receipt');
  const r = result.payload.receipt || {};
  box.className = 'on' + (result.ok ? '' : ' refused');
  box.replaceChildren();
  if (result.ok) {
    box.append(el('b', '', 'COMMITTED'), el('span', 'mono',
      '  ' + r.operation_type + '  ' + r.effect_class
      + '  grants ' + (r.authority_grant_ids || []).length
      + '  entry ' + (r.entry_id || '').slice(6, 18)));
  } else {
    box.append(el('b', '', 'REFUSED  ' + (result.payload.reason_code || result.status)),
      el('div', 'mono', result.payload.message || ''));
  }
}

async function load() {
  S.state = await api.state();
  if (!S.ops) S.ops = await api.operations();
  if (!S.channel) S.channel = S.state.channels[0].channel_id;
  if (!S.thread || !S.state.threads.some(t => t.thread_id === S.thread)) {
    const list = threadsIn(S.channel);
    S.thread = list.length ? list[0].thread_id : null;
  }
  renderAll();
}

document.getElementById('send').onclick = send;
document.getElementById('text').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) send();
});

// The drive handle. A model reads and acts on this surface through the same
// calls the buttons use; this is the API of the piece, not scaffolding.
window.__sov = {
  get state() { return S.state; },
  get ops() { return S.ops; },
  get thread() { return S.thread; },
  get waiting() { return waiting().map(t => t.title); },
  open: id => { selectThread(id); },
  call: api.call,
  post: async body => {
    const r = await api.call('console.post', {
      session_id: S.state.surface_session.session_id, thread_id: S.thread, body });
    await load(); return r;
  },
  reload: load
};

load();
</script>
