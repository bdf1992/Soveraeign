[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soveraeign-kernel"
version = "0.1.0"
description = "Shared kernel reference: governed transitions, receipts, and journal for Soveraeign"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
