[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soveraeign-asset-service"
version = "0.1.0"
description = "Local-first governed asset service for Soveraeign"
requires-python = ">=3.11"

[project.scripts]
soveraeign-asset = "soveraeign_asset_service.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
