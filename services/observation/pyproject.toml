[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soveraeign-observation-service"
version = "0.1.0"
description = "Independent observation of runs, with independence inferred from the run's record"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
